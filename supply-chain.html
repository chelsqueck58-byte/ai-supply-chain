  const earnD = f.next_earnings ? daysTo(f.next_earnings) : null;
  let html = `<div style="padding:6px 0 2px"><b style="font-size:16px">${esc(inst.label)}</b> <span class="muted">${esc(tid)}</span>
    <span class="mono" style="margin-left:12px;color:var(--muted);font-size:12px">
    ${inst.last_close != null ? esc(String(inst.last_close)) : ""} · YTD ${inst.ytd_pct != null ? (inst.ytd_pct >= 0 ? "+" : "") + inst.ytd_pct.toFixed(1) + "%" : "—"}
    ${f.next_earnings ? ` · earnings ${esc(f.next_earnings)}${earnD != null ? ` (${earnD}d)` : ""}` : ""}</span></div>`;

  // upcoming catalysts
  const cal = CAL && CAL.tickers && CAL.tickers[tid];
  html += pageSecHead("📅 Upcoming catalysts");
  if (cal && (cal.events || []).length) {
    const rows = cal.events.filter(e => { const d = daysTo(e.date); return d != null && d >= 0; })
      .sort((a, b) => daysTo(a.date) - daysTo(b.date))
      .map(e => {
        const c = CAL_TYPE_COLOR[e.type] || "var(--muted)";
        return `<tr><td class="ct-dt">${calDateLabel({ ...e, days: daysTo(e.date) })}</td>
          <td><span class="ct-type" style="color:${c};border-color:${c}">${esc(e.type)}</span></td>
          <td>${esc(e.title)}${e.source ? ` <span class="msrc">[${esc(e.source)}]</span>` : ""}</td></tr>`;
      }).join("");
    html += `<table class="ct-table"><tbody>${rows}</tbody></table>`;
  } else html += `<div class="rev-none">No researched calendar entries.</div>`;

  // key movements & non-movers: researched moves (moves.json, vetted reasons)
  // merged with researched events that DIDN'T move it (extras) - dedup by date
  html += pageSecHead("↩ Key movements & non-movers (last ~6 months)");
  {
    const cutoff = new Date(Date.now() - 185 * 86400000).toISOString().slice(0, 10);
    const rows = [];
    const moveDates = [];
    for (const mv of ((MOVES && MOVES[tid]) || {}).moves || []) {
      if (mv.d < cutoff || !mv.reason) continue;
      moveDates.push(mv.d);
      rows.push({ date: mv.d, d1: mv.pct, d5: moveFrom(inst, mv.d, 5),
                  title: null, why: mv.reason, src: mv.source, kind: "move" });
    }
    for (const e of x.past_events || []) {
      if (e.date < cutoff) continue;
      if (moveDates.some(d => Math.abs(new Date(d) - new Date(e.date)) < 3 * 86400000)) continue;
      rows.push({ date: e.date, d1: moveFrom(inst, e.date, 1), d5: moveFrom(inst, e.date, 5),
                  title: e.title, why: e.why, src: e.src, impact: e.impact, kind: "event" });
    }
    rows.sort((a, b) => b.date.localeCompare(a.date));
    // one move per row, cause always explained; rows with no researched cause dropped
    const shown = rows.filter(r => r.why).map(r => {
      if (r.kind === "move") {
        return { ...r, mv: r.d1, tag: "", head: r.why,
                 bullet: `same-day researched move${r.src ? ` [${r.src}]` : ""}` };
      }
      const d1 = r.d1, d5 = r.d5;
      const dir = r.impact === "pos" ? 1 : r.impact === "neg" ? -1 : 0;
      const a1 = d1 != null && Math.abs(d1) >= 1.5 && (dir === 0 || Math.sign(d1) === dir);
      const a5 = d5 != null && Math.abs(d5) >= 3 && (dir === 0 || Math.sign(d5) === dir);
      let mv = d1, tag = "", verdict;
      if (a1) verdict = "news aligned — same-day move";
      else if (a5) { mv = d5; tag = " (5d)"; verdict = "1d muted — market slow to react, repriced over the week"; }
      else if (d1 != null && Math.abs(d1) < 1.5 && (d5 == null || Math.abs(d5) < 3)) verdict = "shrugged — already priced in";
      else verdict = "moved against the news — other flows dominated or it was pre-priced";
      return { ...r, mv, tag, head: r.title,
               bullet: `${r.why} — ${verdict}${r.src ? ` [${r.src}]` : ""}` };
    });
    if (shown.length) {
      html += `<table class="ct-table pg-mv"><tbody>` + shown.map(r =>
        `<tr class="pg-mv-row"><td class="ct-dt">${esc(r.date)}</td>
          <td class="pg-mv-m">${mvCellHtml(r.mv)}${r.tag ? ` <span class="muted">${r.tag}</span>` : ""}</td>
          <td>${esc(r.head || "")}</td></tr>
          <tr class="pg-mv-why"><td></td><td colspan="2">• ${esc(r.bullet)}</td></tr>`
      ).join("") + `</tbody></table>
      <div class="rev-src">One move per row (close-to-close, own price data; "(5d)" = the week's move when the market reacted slowly). Every row's cause explained in the bullet; events with no researched cause are dropped.</div>`;
    } else html += `<div class="rev-none">No researched movements in window.</div>`;
  }

  // earnings preview
  html += pageSecHead("🔎 Upcoming earnings focus");
  if (x.preview && x.preview.expects) {
    html += `<div class="deep-fin-note"><b style="color:#9fd0ff">Expects:</b> ${esc(x.preview.expects)}<br>
      <b style="color:#9fd0ff">Watch:</b> ${(x.preview.watch || []).map(esc).join(" · ")}<br>
      <b style="color:#9fd0ff">Read:</b> ${esc(x.preview.read || "")}</div>`;
  } else if (inst.earn) {
    html += `<div class="deep-fin-note">${esc(inst.earn.split(/\s*Sources?:/i)[0])}</div>`;
  } else html += `<div class="rev-none">Preview research pending.</div>`;

  // last 4 prints: one row per print - EPS vs est joined to the nearest
  // researched reaction, 1d/5d computed from bars at the reaction date
  html += pageSecHead("📊 Last 4 prints");
  {
    const hist = (f.earnings_history || []).slice(-4).reverse();
    const reacts = inst.prev_earnings || [];
    if (hist.length || reacts.length) {
      const rows = (hist.length ? hist : reacts.slice(0, 4)).map(hq => {
        let r = null;
        if (hist.length) {
          // reaction reported within ~40 days after quarter end
          r = reacts.find(p => p.date > hq.q &&
            (new Date(p.date) - new Date(hq.q)) < 40 * 86400000) || null;
        } else r = hq;
        const epsCell = hist.length
          ? `${hq.actual} vs ${hq.est != null ? Number(hq.est).toFixed(2) : "—"}`
          : "—";
        const s = hist.length ? hq.surprise : null;
        const sTxt = s == null ? "" : (Math.abs(s) > 60 ? ` <span class="muted" title="near-zero EPS base">n/m</span>` : ` <span class="pct ${s >= 0 ? "u" : "d"}">(${s >= 0 ? "+" : ""}${s}%)</span>`);
        const d1 = r ? (r.pct != null ? r.pct : moveFrom(inst, r.date, 1)) : null;
        const d5 = r ? moveFrom(inst, r.date, 5) : null;
        return `<tr><td class="ct-dt">${esc(hist.length ? hq.q : hq.date)}</td>
          <td class="mono" style="white-space:nowrap">${epsCell}${sTxt}</td>
          <td class="pg-mv-m">${mvCellHtml(d1)} <span class="muted">1d</span> · ${mvCellHtml(d5)} <span class="muted">5d</span></td>
          <td class="pg-why">${r && r.reason ? esc(r.reason) : "<span class='cmp-na'>—</span>"}${r && r.source ? ` <span class="msrc">[${esc(r.source)}]</span>` : ""}</td></tr>`;
      }).join("");
      html += `<table class="ct-table pg-prints"><thead><tr><th>Quarter</th><th>EPS vs est</th><th>Reaction</th><th>Why</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
  }

  // key metrics -> guidance table -> segments
  html += pageSecHead("📐 Key metrics — 2-year runway (Q1..Q4 → FY, latest right)");
  const fin = pageDeepFinHtml(tid);
  html += fin.cw;
  html += pageGuidanceHtml(x);
  html += fin.seg;

  // revenue mix table + what each segment sells
  const rm = REV_MIX && REV_MIX[tid];
  if (rm && (rm.segments || []).length) {
    html += pageSecHead("🧩 Revenue mix — what each segment sells");
    const expl = {};
    for (const s of x.segment_explainers || []) expl[(s.segment || "").toLowerCase()] = s.sells;
    html += `<table class="ct-table" style="max-width:780px"><thead><tr><th>Segment</th><th>% of rev</th><th>What it sells</th></tr></thead><tbody>` +
      rm.segments.map(s => {
        const key = (s.name || "").toLowerCase();
        const e = expl[key] ||
          (Object.entries(expl).find(([k]) => k && (key.includes(k) || k.includes(key))) || [])[1];
        return `<tr><td style="white-space:nowrap"><b>${esc(s.name)}</b></td>
          <td class="mono">${s.pct != null ? Number(s.pct).toFixed(1) + "%" : "—"}</td>
          <td class="pg-why">${e ? esc(e) : "<span class='cmp-na'>—</span>"}</td></tr>`;
      }).join("") + `</tbody></table>
    <div class="rev-src">Mix as of ${esc(rm.fiscal_period || "latest reported")}${rm.source ? " — " + esc(rm.source) : ""}.</div>`;
  }

  // model launch history (AI model-builder pages only)
  if (AI_MODEL_TIDS.has(tid) && MODELS && MODELS.tickers && MODELS.tickers[tid]) {
    const ml = MODELS.tickers[tid];
    html += pageSecHead("🤖 Model launch history — verdicts & what the stock did");
    const vBadge = v => v === "success" ? `<span class="pct u">success</span>`
      : v === "flop" ? `<span class="pct d">flop</span>`
      : `<span style="color:var(--accent)">mixed</span>`;
    html += `<table class="ct-table"><thead><tr><th>Date</th><th>Model</th><th>Verdict</th><th>Reaction</th><th>Why</th></tr></thead><tbody>` +
      ml.launches.map(l => {
        return `<tr><td class="ct-dt">${esc(l.date)}</td><td><b>${esc(l.model)}</b> <span class="pe-nm" title="Claimed: ${esc(l.claim || "")}">ⓘ</span></td>
          <td>${vBadge(l.verdict)}</td>
          <td class="pg-mv-m">${mvCellHtml(l.move_pct)} <span class="muted">1d</span> · ${mvCellHtml(moveFrom(inst, l.date, 5))} <span class="muted">5d</span></td>
          <td class="pg-why">${esc(l.why || "")}${l.src ? ` <span class="msrc">[${esc(l.src)}]</span>` : ""}</td></tr>`;
      }).join("") + `</tbody></table>
      <div class="rev-src">Verdict = contemporaneous market/developer judgment (researched). 1d/5d = close-to-close from own price data — launches rarely move megacaps alone; the verdict column is the durable signal.</div>`;
    const eco = (MODELS.ecosystem || {}).events || [];
    if (eco.length) {
      html += `<div style="margin-top:10px; font-weight:700; font-size:12px; color:var(--muted);">Ecosystem shocks (private-lab launches that moved public names)</div>
        <table class="ct-table"><tbody>` + eco.map(e => {
          const aff = (e.affected || []).map(a => `<b>${esc(a.tid)}</b> <span class="pct ${(a.move_pct ?? 0) >= 0 ? "u" : "d"}">${a.move_pct == null ? "—" : (a.move_pct >= 0 ? "+" : "") + a.move_pct + "%"}</span>`).join(" · ");
          return `<tr><td class="ct-dt">${esc(e.date)}</td><td><b>${esc(e.model)}</b> <span class="muted">${esc(e.lab || "")}</span></td>
            <td>${esc(e.why_it_mattered || "")}${e.src ? ` <span class="msrc">[${esc(e.src)}]</span>` : ""}</td>
            <td style="white-space:nowrap">${aff}</td></tr>`;
        }).join("") + `</tbody></table>`;
    }
  }

  // delivery-war loss tracker (Meituan / Alibaba / JD pages only)
  if (DELIVERY_WAR_TIDS.has(tid) && DELIVERY && (DELIVERY.companies || []).length) {
    html += pageSecHead("🍜 Delivery war — losses narrowing?");
    const badge = n => n === "yes" ? `<span class="pct u">narrowing</span>`
      : n === "no" ? `<span class="pct d">not narrowing</span>`
      : `<span style="color:var(--accent)">mixed</span>`;
    html += DELIVERY.companies.map(c => {
      const own = c.tid === tid;
      const cells = (c.periods || []).map(p =>
        `<td><div class="muted" style="font-size:9px">${esc(p.q)}</div><span class="${own ? "pe-fwd1" : "pe-current"}">${esc(p.value)}</span></td>`).join("");
      return `<div style="margin-top:8px;${own ? "" : "opacity:.85"}">
        <b>${esc(c.label)}</b> <span class="muted" style="font-size:11px">${esc(c.metric_name || "")}</span> ${badge(c.narrowing)}
        <span class="pe-nm" title="${esc(c.metric_basis || "")}">ⓘ</span>
        <table class="cmp-table deep-fin-table" style="margin-top:3px"><tbody><tr>${cells || "<td>—</td>"}</tr></tbody></table>
        <div class="rev-src">${esc(c.latest_signal || "")}</div></div>`;
    }).join("");
    if (DELIVERY.war_summary) html += `<div class="deep-fin-note" style="margin-top:8px">${esc(DELIVERY.war_summary)}</div>`;
  }

  // P/E
  html += pageSecHead("⚖ P/E — history, forward, and why it re-rated");
  html += pagePeHtml(tid);
  if (x.pe_narrative) html += `<div class="deep-fin-note" style="margin-top:6px"><b style="color:#9fd0ff">Re-rating narrative</b> <span class="muted">(interpretive, from analyst/press commentary)</span>: ${esc(x.pe_narrative)}</div>`;

  el.innerHTML = html;
}

// Semis Board - data-only catalyst desk view for the key semiconductor names:
// next researched catalyst, next earnings, last earnings reactions (with a
// typical-move average as the implied-move stand-in - there's no options/IV
// feed here), EPS surprise history, researched forward P/E.
const SEMIS_BOARD = ["NVDA", "AMD", "AVGO", "MRVL", "INTC", "TSM", "SMI",
                     "ASML", "AMAT", "LRCX", "KLAC", "MU", "000660", "005930",
                     "2454", "688256", "SMCI"];
function renderSemisBoard() {
  const el = document.getElementById("semis-wrap");
  const byId = {};
  DATA.instruments.forEach(i => { byId[i.id] = i; });
  const rows = [];
  for (const tid of SEMIS_BOARD) {
    const inst = byId[tid];
    if (!inst) continue;
    const f = inst.fund || {};
    const cal = CAL && CAL.tickers && CAL.tickers[tid];
    const nextCat = ((cal && cal.events) || [])
      .map(e => ({ ...e, days: daysTo(e.date) }))
      .filter(e => e.days != null && e.days >= 0 && e.days <= 95 && e.type !== "Earnings")
      .sort((a, b) => a.days - b.days)[0] || null;
    const earnDays = f.next_earnings ? daysTo(f.next_earnings) : null;
    const reactions = (inst.prev_earnings || []).slice(0, 4);
    const absMoves = reactions.map(r => Math.abs(r.pct));
    const typMove = absMoves.length
      ? (absMoves.reduce((a, b) => a + b, 0) / absMoves.length) : null;
    const hist = f.earnings_history || [];
    const beats = hist.filter(h => (h.surprise ?? 0) > 0).length;
    let avgSurp = hist.length
      ? hist.reduce((a, h) => a + (h.surprise || 0), 0) / hist.length : null;
    // near-zero EPS bases make surprise % meaningless (INTC: est ~$0.01 vs
    // actual ~$0.14 reads as +1300%) - suppress the average, keep the count
    if (avgSurp != null && Math.abs(avgSurp) > 60) avgSurp = null;
    const fp = FWD_PE && FWD_PE[tid];
    const fy1 = fp && (fp.years || []).find(y => y.pe != null);
    rows.push({ tid, inst, f, nextCat, earnDays, reactions, typMove,
                nBeats: hist.length ? `${beats}/${hist.length}` : null,
                avgSurp, fy1 });
  }
  rows.sort((a, b) => (a.earnDays ?? 999) - (b.earnDays ?? 999));
  const chip = (r) => `<span class="sb-chip ${r.pct >= 0 ? "u" : "d"}" title="${esc(r.date)}: ${esc(r.reason || "")}">${r.pct >= 0 ? "+" : ""}${r.pct}%</span>`;
  const trs = rows.map(r => `<tr onclick="goTo('${r.tid}')">
    <td class="ct-tk"><b>${r.tid}</b> <span class="muted">${esc(r.inst.label)}</span></td>
    <td>${r.earnDays != null ? `${esc(r.f.next_earnings)} <span class="muted">(${r.earnDays}d)</span>` : '<span class="muted">—</span>'}</td>
    <td class="sb-cat">${r.nextCat ? `${esc(calDateLabel(r.nextCat).replace(/<[^>]*>/g, ""))} · ${esc(r.nextCat.title)}` : '<span class="muted">—</span>'}</td>
    <td>${r.reactions.length ? r.reactions.map(chip).join(" ") : '<span class="muted">—</span>'}</td>
    <td>${r.typMove != null ? `±${r.typMove.toFixed(1)}%` : '<span class="muted">—</span>'}</td>
    <td>${r.nBeats ? `${r.nBeats}${r.avgSurp != null ? ` <span class="muted">(avg ${r.avgSurp >= 0 ? "+" : ""}${r.avgSurp.toFixed(1)}%)</span>` : ""}` : '<span class="muted">—</span>'}</td>
    <td>${r.fy1 ? `${r.fy1.pe}x <span class="muted">${esc(r.fy1.fy_label || "")}</span>`
        : (r.f.fwd_pe != null ? `${r.f.fwd_pe.toFixed(1)}x <span class="muted">(Yahoo)</span>` : '<span class="muted">—</span>')}</td>
    <td>${r.f.peg != null ? r.f.peg : '<span class="muted">—</span>'}</td>
  </tr>`).join("");
  el.innerHTML = `<div class="hist-head">Semis Board — catalysts &amp; earnings desk view (sorted by next earnings)</div>
    <table class="cmp-table"><thead><tr>
      <th>Name</th><th>Next Earnings</th><th>Next Catalyst (non-earnings)</th>
      <th>Moves Around Prints</th><th>Avg |Move|</th><th>EPS Beats</th>
      <th>Fwd P/E</th><th>PEG</th>
    </tr></thead><tbody>${trs}</tbody></table>
    <div class="rev-src" style="margin-top:8px">Moves Around Prints = researched 1-day moves in the days around past earnings, newest first (hover for the why) — includes post-earnings follow-through and occasional sector-sympathy moves, NOT strictly print-day reactions. Avg |Move| = average of those; a rough volatility feel, NOT options-implied (no IV feed here). EPS Beats = last ~4 quarters vs consensus (Yahoo); avg surprise suppressed when a near-zero EPS base makes the % meaningless. Fwd P/E = today's price ÷ researched consensus EPS for the next unreported fiscal year, (Yahoo) marks Yahoo's own fwd P/E where research coverage is missing. PEG = fwd P/E ÷ fwd EPS growth. Catalysts from the researched 3-month calendar.</div>`;
}

  document.getElementById("tab-macro-ev").classList.toggle("active", tabKey === "macro-ev");
  document.getElementById("macro-ev-wrap").style.display = tabKey === "macro-ev" ? "" : "none";
  document.getElementById("tab-deal-map").classList.toggle("active", tabKey === "deal-map");
  document.getElementById("deal-map-wrap").style.display = tabKey === "deal-map" ? "" : "none";
  for (const c of CATEGORIES) {
    document.getElementById("tab-" + c.key).classList.toggle("active", tabKey === c.key);
    const show = tabKey === c.key;
    document.getElementById("grid-" + c.key).style.display = show ? "" : "none";
    document.getElementById("hist-" + c.key).style.display = show ? "" : "none";
  }
  // Revenue Mix / Compare are pure reference tables - no ideas/catalysts
  // sections. Those divs are fixed top-level elements shared across every
  // tab, so without this they'd keep showing stale content from whichever
  // tab was active before switching here.
  const showIdeas = tabKey !== "revenue" && tabKey !== "compare" && tabKey !== "pe" && tabKey !== "nvda-eco" && tabKey !== "circ-fin" && tabKey !== "deep-fin" && tabKey !== "semis" && tabKey !== "pages" && tabKey !== "macro-ev" && tabKey !== "deal-map";
  document.getElementById("ideas").style.display = showIdeas ? "" : "none";
  document.getElementById("catalysts30").style.display = showIdeas ? "" : "none";
  document.getElementById("pastCatalysts").style.display = showIdeas ? "" : "none";
  if (tabKey === "revenue") {
    if (DATA) renderRevenueMix();
    return;
  }
  if (tabKey === "compare") {
    if (DATA) renderCompareTable();
    return;
  }
  if (tabKey === "pe") {
    if (DATA) renderPeHistory();
    return;
  }
  if (tabKey === "nvda-eco") {
    if (DATA) renderNvdaEcosystem();
    return;
  }
  if (tabKey === "circ-fin") {
    if (DATA) renderCircularFinancing();
    return;
  }
  if (tabKey === "deep-fin") {
    if (DATA) renderDeepFinancials();
    return;
  }
  if (tabKey === "semis") {
    if (DATA) renderSemisBoard();
    return;
  }
  if (tabKey === "pages") {
    if (DATA) renderStockPages();
    return;
  }
  if (tabKey === "macro-ev") {
    if (DATA) renderMacroEvents();
    return;
  }
  if (tabKey === "deal-map") {
    if (DATA) renderDealMap();
    return;
  }
  const category = tabKey === "summary" ? null : tabKey;
  if (DATA) {
    renderIdeas(category);
    renderCatalystsTable(category);
    renderPastCatalysts(category, 30);
    if (category) renderSectorHistory(category);
  }
};

function buildShell() {
  const tabs = document.getElementById("tabs");
  const grids = document.getElementById("grids");
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.id = "tab-" + key; b.textContent = label;
    b.onclick = () => showTab(key);
    tabs.appendChild(b);
  };
  mk("summary", "Summary");
  for (const c of CATEGORIES) {
    mk(c.key, c.label);
    const main = document.createElement("main");
    main.id = "grid-" + c.key; main.className = "monitor-grid"; main.style.display = "none";
    grids.appendChild(main);
    const hist = document.createElement("div");
    hist.id = "hist-" + c.key; hist.className = "hist-wrap"; hist.style.display = "none";
    grids.appendChild(hist);
  }
  mk("revenue", "Revenue Mix");
  const revWrap = document.createElement("div");
  revWrap.id = "revenue-wrap"; revWrap.className = "rev-wrap"; revWrap.style.display = "none";
  grids.appendChild(revWrap);

  mk("compare", "Compare");
  const cmpWrap = document.createElement("div");
  cmpWrap.id = "compare-wrap"; cmpWrap.className = "cmp-wrap"; cmpWrap.style.display = "none";
  grids.appendChild(cmpWrap);

  mk("pe", "P/E History");
  const peWrap = document.createElement("div");
  peWrap.id = "pe-wrap"; peWrap.className = "cmp-wrap"; peWrap.style.display = "none";
  grids.appendChild(peWrap);

  mk("nvda-eco", "NVDA Ecosystem");
  const nvdaEcoWrap = document.createElement("div");
  nvdaEcoWrap.id = "nvda-eco-wrap"; nvdaEcoWrap.className = "cmp-wrap"; nvdaEcoWrap.style.display = "none";
  grids.appendChild(nvdaEcoWrap);

  mk("circ-fin", "Circular Financing");
  const circFinWrap = document.createElement("div");
  circFinWrap.id = "circ-fin-wrap"; circFinWrap.className = "cmp-wrap"; circFinWrap.style.display = "none";
  grids.appendChild(circFinWrap);

  mk("deep-fin", "Deep Financials");
  const deepFinWrap = document.createElement("div");
  deepFinWrap.id = "deep-fin-wrap"; deepFinWrap.className = "cmp-wrap"; deepFinWrap.style.display = "none";
  grids.appendChild(deepFinWrap);

  mk("semis", "Semis Board");
  const semisWrap = document.createElement("div");
  semisWrap.id = "semis-wrap"; semisWrap.className = "cmp-wrap"; semisWrap.style.display = "none";
  grids.appendChild(semisWrap);

  mk("pages", "Stock Pages");
  const pagesWrap = document.createElement("div");
  pagesWrap.id = "pages-wrap"; pagesWrap.className = "cmp-wrap"; pagesWrap.style.display = "none";
  grids.appendChild(pagesWrap);

  mk("macro-ev", "Macro Events");
  const macroWrap = document.createElement("div");
  macroWrap.id = "macro-ev-wrap"; macroWrap.className = "cmp-wrap"; macroWrap.style.display = "none";
  grids.appendChild(macroWrap);

  mk("deal-map", "Deal Map");
  const dealWrap = document.createElement("div");
  dealWrap.id = "deal-map-wrap"; dealWrap.className = "cmp-wrap"; dealWrap.style.display = "none";
  grids.appendChild(dealWrap);
}

function load() {
  document.getElementById("meta").textContent = "fetching data...";
  buildShell();
  Promise.all([
    fetch("./data.json?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    fetch("./moves.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./supply-chain-map.json?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(`map HTTP ${r.status}`); return r.json(); }),
    fetch("./earnings-dates.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./revenue-breakdown.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./deep-fundamentals.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./geo-mix.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./fx-rates.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./historical-pe.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./forward-pe.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./roic.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./nvda-partnerships.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./nvda-debt-financing.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./circular-financing.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./deep-financials.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./catalyst-calendar.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./stock-page-extras.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./delivery-war.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./model-launches.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./deal-map.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
  ]).then(([data, moves, scmap, earnDates, revMix, deepFund, geoMix, fxRates, histPe, fwdPe, roic, nvdaPartnerships, nvdaDebt, circFin, deepFin, cal, pageExtras, delivery, models, deals]) => {
    DATA = data; MOVES = moves; SC_MAP = scmap; EARN_DATES = earnDates; REV_MIX = revMix; DEEP_FUND = deepFund; GEO_MIX = geoMix; FX_RATES = fxRates; HIST_PE = histPe; FWD_PE = fwdPe; ROIC = roic; NVDA_PARTNERSHIPS = nvdaPartnerships; NVDA_DEBT = nvdaDebt; CIRC_FIN = circFin; DEEP_FIN = deepFin; CAL = cal; PAGE_EXTRAS = pageExtras; DELIVERY = delivery; MODELS = models; DEALS = deals;
    STALE = checkStale(DATA);
    const ideas = DATA.instruments.filter(i => i.idea && i.idea.kind === "enter").length;
    document.getElementById("meta").textContent =
      `${DATA.instruments.length} names · ${ideas} enter ideas · ${new Date(DATA.generated_at).toLocaleString()}`;
    render();
    showTab("summary");
  }).catch(err => {
    console.error("load error:", err);
    document.getElementById("meta").textContent = `ERROR: ${err.message}`;
  });
}
load();
</script>
