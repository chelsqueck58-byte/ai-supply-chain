<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Chain Intelligence</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#21262d; --text:#e6edf3;
    --muted:#7d8590; --up:#26a641; --down:#f85149;
    --ema:#e3b341; --sma:#58a6ff; --vwap:#bc8cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); position:sticky; top:0;
    background:var(--bg); z-index:5; }
  header h1 { margin:0 0 3px; font-size:15px; font-weight:600; letter-spacing:.3px; display:inline; }
  header .meta { color:var(--muted); font-size:12px; margin-left:10px; }
  #stale { display:none; background:var(--down); color:#fff; padding:10px 16px; font-weight:600; text-align:center; }
  #stale.show { display:block; }
  .monitor-grid { padding:12px; display:grid; gap:10px; grid-template-columns:repeat(4,1fr); }
  @media (max-width:1700px) { .monitor-grid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:1200px) { .monitor-grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:760px)  { .monitor-grid { grid-template-columns:1fr; } }
  .section { grid-column:1/-1; font-size:12px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.5px; padding:8px 2px 2px; border-bottom:1px solid var(--border); }
  .section.subcat { color:#d4a85f; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .card .top { display:flex; align-items:center; gap:6px; padding:8px 10px; flex-wrap:wrap; }
  .card .name { font-weight:600; }
  .card .id { color:var(--muted); font-size:11px; }
  .card .px { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600; }
  .pct { font-variant-numeric:tabular-nums; font-size:11px; }
  .pct.u { color:var(--up); } .pct.d { color:var(--down); }
  .badge { font-size:10px; font-weight:600; padding:1px 5px; border-radius:4px; white-space:nowrap; }
  .badge.up { color:var(--up); background:rgba(38,166,65,.14); }
  .badge.down { color:var(--down); background:rgba(248,81,73,.14); }
  .badge.flat { color:var(--muted); background:rgba(125,133,144,.14); }
  .badge.cta-long { color:var(--up); background:rgba(38,166,65,.10); }
  .badge.cta-short { color:var(--down); background:rgba(248,81,73,.10); }
  .remark { padding:5px 10px; font-size:11px; border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums; }
  .remark.enter { color:var(--up); }
  .remark.exit { color:var(--down); }
  .remark.muted { color:var(--muted); }
  .remark .muted { color:var(--muted); }
  .fund { padding:4px 10px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums; }
  .news { padding:5px 10px; font-size:11px; color:#9fd0ff; border-bottom:1px solid var(--border); }
  .cat { padding:5px 10px; font-size:11px; color:var(--text); border-top:1px solid var(--border); }
  .cat b.e { color:var(--down); }
  .catline { padding:5px 10px; font-size:11px; color:#c9a5f0; border-top:1px solid var(--border); }
  .teleblock { padding:6px 10px; font-size:11px; border-top:1px solid var(--border); background:rgba(240,180,41,.05); }
  .teleblock .th { color:#f0b429; font-weight:600; margin-bottom:2px; }
  .teleblock .tb { color:var(--text); margin:2px 0; white-space:pre-line; }
  .teleblock .tb:last-child { margin-bottom:0; }
  .earn { padding:6px 10px; font-size:11px; border-top:1px solid var(--border); background:rgba(88,166,255,.05); }
  .earn .eh { color:var(--muted); }
  .earn .efocus { color:#9fd0ff; margin-top:3px; }
  .ct-prev { color:#c9a5f0; margin-top:3px; }
  .ct-event { font-weight:600; }
  .ct-focus { color:#9fd0ff; margin-top:2px; }
  .chart { height:300px; }
  #ideas { padding:10px 12px; border-bottom:1px solid var(--border); background:#12161c; }
  #catalysts30 { padding:10px 12px; border-bottom:1px solid var(--border); background:#12161c; }
  #pastCatalysts { padding:10px 12px; border-bottom:1px solid var(--border); background:#12161c; }
  .ct-head { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:#9fd0ff; margin:2px 0 6px; }
  .ct-table { width:100%; border-collapse:collapse; font-size:12px; }
  .ct-table th { text-align:left; color:var(--muted); font-weight:600; font-size:10px;
    text-transform:uppercase; letter-spacing:.4px; padding:4px 8px; border-bottom:1px solid var(--border); }
  .ct-table td { padding:5px 8px; border-bottom:1px solid #1b2027; vertical-align:top; }
  .ct-table tr { cursor:pointer; }
  .ct-table tr:hover td { background:rgba(88,166,255,.06); }
  .ct-tk { white-space:nowrap; }
  .ct-dt { white-space:nowrap; font-variant-numeric:tabular-nums; color:var(--text); }
  .ct-tx b.e { color:#9fd0ff; }
  .ideas-head { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:#f5c518; margin:2px 0 6px; }
  .ideas-head.tp { color:var(--down); margin-top:10px; }
  .ideas-row { display:flex; gap:8px; flex-wrap:wrap; }
  .ideabox { border:1px solid #f5c518; border-radius:8px; padding:7px 10px; min-width:210px;
    background:rgba(245,197,24,.06); font-size:12px; }
  .ideabox .ih { font-weight:600; margin-bottom:2px; }
  .ideabox .ih .id { color:var(--muted); font-size:10px; font-weight:400; }
  .ideabox .ir { color:var(--muted); font-size:11px; margin-bottom:3px; }
  .ideabox .nw { color:#9fd0ff; font-size:11px; margin-top:3px; }
  .tpchip { border:1px solid var(--down); border-radius:6px; padding:4px 8px; font-size:11px;
    color:var(--down); background:rgba(248,81,73,.06); }
  .tpchip .id { color:var(--muted); font-size:10px; font-weight:400; }
  .card.enter-idea { border-color:#f5c518; box-shadow:inset 0 0 0 2px #f5c518; }
  .er-soon { color:var(--down); font-weight:600; }
  .ideabox, .tpchip { cursor:pointer; }
  .ideabox:hover, .tpchip:hover { filter:brightness(1.25); }
  .card.flash { animation:flash 1.2s ease-out; }
  @keyframes flash { 0% { box-shadow:inset 0 0 0 2px #58a6ff; } 100% { box-shadow:none; } }
  .tabs { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; }
  .tabs button { background:transparent; border:1px solid var(--border); border-bottom:none;
    color:var(--muted); padding:5px 14px; border-radius:6px 6px 0 0; cursor:pointer; font-size:13px; font-family:inherit; }
  .tabs button.active { background:var(--panel); color:var(--text); }
  /* Per-sector stock history (below the cards) */
  .hist-wrap { padding:0 12px 12px; }
  /* Revenue Mix tab */
  .rev-wrap { padding:12px; display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
  .rev-card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .rev-top { display:flex; align-items:baseline; gap:6px; margin-bottom:2px; }
  .rev-top .name { font-weight:600; }
  .rev-top .id { color:var(--muted); font-size:11px; }
  .rev-period { color:var(--muted); font-size:10px; margin-bottom:6px; }
  .rev-mini-table { width:100%; border-collapse:collapse; font-size:11px; }
  .rev-mini-table td { padding:3px 4px; border-bottom:1px solid #1b2027; }
  .rev-mini-table tr:last-child td { border-bottom:none; }
  .rev-mini-name { color:var(--text); }
  .rev-mini-num { color:#9fd0ff; font-weight:600; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; width:1%; }
  .rev-qual { color:var(--muted); font-weight:400; font-style:italic; cursor:help; text-decoration:underline dotted; }
  .rev-src { color:var(--muted); font-size:9px; margin-top:6px; }
  .rev-none { color:var(--muted); font-size:11px; font-style:italic; }
  /* Compare tab - kept dense on purpose: these tables are read as a list of
     20+ stocks, not a handful of cards, so vertical space per row directly
     trades off against how many names fit on screen without scrolling. */
  .cmp-wrap { padding:12px; overflow-x:auto; }
  .cmp-table { width:100%; border-collapse:collapse; font-size:10px; min-width:900px; }
  .cmp-table th { text-align:left; color:var(--muted); font-weight:600; font-size:8px;
    text-transform:uppercase; letter-spacing:.3px; padding:3px 6px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--bg); }
  .cmp-table td { padding:2px 6px; border-bottom:1px solid #1b2027; vertical-align:top; white-space:nowrap; }
  .cmp-table tr:hover td { background:rgba(88,166,255,.06); }
  .cmp-cat-row td { padding-top:8px; padding-bottom:2px; font-weight:700; color:#9fd0ff; text-transform:uppercase;
    font-size:9px; letter-spacing:.3px; border-bottom:1px solid var(--border); white-space:normal; }
  .cmp-name { font-weight:600; color:var(--text); }
  .cmp-id { color:var(--muted); font-size:9px; margin-left:4px; }
  /* Debt/Cash and Off-BS Liabilities share this class - widened so their
     multi-line lists (Debt/Cash/Net/D-E, or several commitment line items)
     wrap less, which is what actually drives row height. */
  .cmp-seg-list { white-space:normal; max-width:400px; font-size:9px; color:var(--muted); line-height:1.25; }
  .cmp-seg-list b { color:var(--text); }
  .cmp-na { color:var(--muted); }
  .cmp-src-note { color:var(--muted); font-size:8px; font-style:italic; white-space:normal; max-width:200px; }
  .cmp-capex-headline { color:#f5c518; font-weight:700; font-size:12px; margin-bottom:2px; white-space:nowrap; }
  /* Wider than .cmp-seg-list on purpose - capex guidance text is usually the
     longest cell in the row, so it wraps into the most lines. A wider column
     here means fewer wrapped lines, which shortens every row's height and
     lets more stocks fit on screen without scrolling. */
  .cmp-capex-text { white-space:normal; max-width:500px; font-size:9px; color:var(--muted); line-height:1.25; }
  /* Compare tab only (scoped via #compare-wrap - .cmp-table is shared with
     the P/E History tab, which wasn't part of this request). Company and
     Mkt Cap are the shortest-content columns; narrowing them frees up
     horizontal room for Debt/Cash/Off-BS/Capex above, and lets the row
     count on screen go up without needing more horizontal scroll. */
  #compare-wrap .cmp-table td:first-child { white-space:normal; max-width:100px; }
  #compare-wrap .cmp-table td:nth-child(2) { white-space:normal; max-width:90px; }
  .cmp-mktcap-usd { display:block; color:var(--muted); font-size:8px; }
  /* P/E History tab */
  .pe-current { font-weight:600; color:var(--text); }
  .pe-nm { color:var(--muted); font-style:italic; font-size:9px; }
  .pe-range-wrap { display:flex; flex-direction:column; gap:3px; min-width:130px; }
  .pe-range-lbl { font-size:9px; color:var(--muted); display:flex; justify-content:space-between; white-space:nowrap; }
  .pe-range-track { position:relative; width:100%; height:6px; background:#1b2027; border-radius:3px; }
  .pe-range-fill { position:absolute; top:0; bottom:0; background:rgba(88,166,255,.25); border-radius:3px; }
  .pe-range-marker { position:absolute; top:-3px; width:2px; height:12px; background:#58a6ff; border-radius:1px; }
  .pe-pctile { font-size:9px; color:var(--muted); }
  .pe-pctile b { color:#9fd0ff; }
  .hist-head { font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    color:#9fd0ff; padding:14px 2px 8px; border-top:2px solid var(--border); margin-top:6px; }
  .hist-grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(470px,1fr)); }
  .hcard { background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .hcard .htop { padding:8px 10px; font-weight:600; border-bottom:1px solid var(--border); }
  .hcard .htop .id { color:var(--muted); font-size:11px; font-weight:400; }
  .hchart { height:120px; }
  .moves { padding:4px 10px 8px; font-size:12px; }
  .mv { display:flex; gap:8px; padding:3px 0; border-top:1px solid #1b2027; align-items:baseline; }
  .mv .md { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .mv .mp { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; min-width:48px; }
  .mv .mp.u { color:var(--up); } .mv .mp.d { color:var(--down); }
  .mv .mr b { color:var(--text); } .mv .mr .mw { color:var(--muted); }
  .mv .msrc { color:var(--muted); font-size:10px; }
</style>
</head>
<body>
<div id="stale"></div>
<header>
  <h1>Supply Chain Intelligence</h1><span class="meta" id="meta">loading…</span>
  <nav class="tabs" id="tabs"></nav>
</header>
<div id="ideas"></div>
<div id="catalysts30"></div>
<div id="pastCatalysts"></div>
<div id="grids"></div>

<script src="./vendor/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";
const TREND_ORDER = { up: 0, flat: 1, down: 2 };
let DATA = null, MOVES = null, SC_MAP = null, EARN_DATES = null, REV_MIX = null, DEEP_FUND = null, GEO_MIX = null, FX_RATES = null, OFF_BS = null, HIST_PE = null, FWD_PE = null, ROIC = null, NVDA_PARTNERSHIPS = null, STALE = false, OBSERVER = null;
const REVENUE_TAB_CATEGORIES = new Set(["china-internet", "compute", "hyperscaler-cloud", "platform"]);
// Individual tickers pulled in from a category that isn't otherwise in
// scope (e.g. ASML from Equipment) - added one at a time on request rather
// than including that whole category's other names.
const REVENUE_TAB_EXTRA_TICKERS = new Set(["ASML"]);
function inRevenueTabScope(instId, category) {
  return REVENUE_TAB_CATEGORIES.has(category) || REVENUE_TAB_EXTRA_TICKERS.has(instId);
}

// Supply-chain category tabs. Keys must match getCategory() output.
const CATEGORIES = [
  { key: "hyperscaler-cloud", label: "Tech Platforms" },
  { key: "compute",           label: "Compute" },
  { key: "foundry",           label: "Foundry" },
  { key: "memory",            label: "Memory" },
  { key: "equipment",         label: "Equipment" },
  { key: "power-analog",      label: "Power/Analog" },
  { key: "china-internet",    label: "China Internet" },
  { key: "china-ev",          label: "China EV" },
  { key: "singapore",         label: "Singapore/SE Asia" },
  { key: "consumer",          label: "Consumer" },
  { key: "gold-jewelry",      label: "Gold & Jewelry" },
];
const CAT_KEYS = new Set(CATEGORIES.map(c => c.key));

// Map a raw supply-chain-map category to a tab key (consolidates small buckets).
function getCategory(inst) {
  const m = SC_MAP && SC_MAP[inst.id];
  if (!m) return null;
  let c = m.category;
  if (c === "platform") c = "hyperscaler-cloud";
  if (c.startsWith("singapore") || c === "se-asia-tech") c = "singapore";
  if (c === "china-hardware") c = "china-ev";
  if (c === "global-consumer" || c === "consumer-electronics") c = "consumer";
  return CAT_KEYS.has(c) ? c : null;   // benchmarks (SPY/QQQ) -> no tab, summary only
}
function getSubcategory(inst) {
  const m = SC_MAP && SC_MAP[inst.id];
  return m && m.subcategory ? m.subcategory : "Other";
}

// Explicit per-category row order for tabs that group stocks by category
// (Revenue Mix, Compare, P/E History) - everything else stays alphabetical.
// Keyed by the display label (all four tabs' byCat maps converge on the
// same label string, e.g. "China Internet", even though they build it via
// slightly different lookups). Only China Internet has an order defined
// right now; add more labels here if the same request comes up for
// Compute/Tech Platforms/etc.
const CATEGORY_ORDER = {
  "China Internet": ["9988", "0700", "9888", "1810", "2513", "0100", "3690", "9618", "PDD"],
};
function parseFyYear(label) {
  const m = /^FY(\d{4})$/.exec(label || "");
  return m ? parseInt(m[1], 10) : null;
}
function sortForCategoryTab(list, categoryLabel) {
  const order = CATEGORY_ORDER[categoryLabel];
  if (!order) return list.sort((a, b) => a.label.localeCompare(b.label));
  return list.sort((a, b) => {
    const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
    // Unlisted tickers (a future addition to the category not yet in the
    // fixed order) fall to the end, alphabetically among themselves, rather
    // than disappearing or throwing off the intended order.
    if (ia === -1 && ib === -1) return a.label.localeCompare(b.label);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
}

function esc(s) {
  if (s == null) return "";
  const div = document.createElement("div");
  div.textContent = String(s);
  return div.innerHTML;
}

// Several names in the Compare/P-E-History cohort are dual-listed, and the
// site only tracks ONE ticker per company for pricing/fundamentals (whatever
// Yahoo symbol universe.json points at) - showing just that one id reads as
// wrong to anyone expecting the more commonly-cited symbol (e.g. Baidu shows
// as "9888", its secondary HK listing, when BIDU - the Nasdaq ADR - is the
// one most US-side coverage actually references). This doesn't change what
// data is fetched or displayed anywhere else, purely a label so the company
// is unambiguously identifiable regardless of which ticker the reader knows
// it by. Order is [primary/most-recognized, ...secondary listings].
const ALT_LISTINGS = {
  "9988": ["BABA"],        // Alibaba - NYSE ADR, tracked ticker is the 9988 HK listing
  "9888": ["BIDU"],        // Baidu - Nasdaq ADR, tracked ticker is the 9888 HK listing
  "9618": ["JD"],          // JD.com - Nasdaq ADR, tracked ticker is the 9618 HK listing
  "0700": ["TCEHY (OTC, unsponsored)"],  // Tencent - no major-exchange US listing
};
function companyIdCell(inst) {
  const alts = ALT_LISTINGS[inst.id];
  const idText = alts ? `${esc(inst.id)} / ${alts.map(esc).join(" / ")}` : esc(inst.id);
  return `<span class="cmp-name">${esc(inst.label)}</span><span class="cmp-id">${idText}</span>`;
}

function smaSeries(closes, period) {
  const out = []; let sum = 0;
  for (let i = 0; i < closes.length; i++) {
    sum += closes[i]; if (i >= period) sum -= closes[i - period];
    out.push(i >= period - 1 ? sum / period : null);
  }
  return out;
}
function fmtPct(v) {
  if (v === null || v === undefined) return "";
  return `<span class="pct ${v >= 0 ? "u" : "d"}">${v >= 0 ? "+" : ""}${v.toFixed(2)}%</span>`;
}
function checkStale(p) {
  const ageH = (Date.now() - new Date(p.generated_at).getTime()) / 3.6e6;
  const limit = p.stale_after_hours || 30;
  const b = document.getElementById("stale");
  if (ageH > limit) {
    b.textContent = `⚠ DATA STALE — ${ageH.toFixed(1)}h old (limit ${limit}h). Levels hidden; don't trade off this until it refreshes.`;
    b.classList.add("show"); return true;
  }
  return false;
}
function daysTo(ds) {
  // Pure UTC calendar-day difference (see stock-monitor index.html for why).
  if (!ds) return null;
  const [y, m, d] = ds.split("-").map(Number);
  const target = Date.UTC(y, m - 1, d);
  const now = new Date();
  const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  return Math.round((target - today) / 8.64e7);
}

function earnTag(dateStr) {
  if (!dateStr) return "";
  const days = daysTo(dateStr);
  if (days == null || days < 0) return "";
  if (days <= 30) return `<span class="er-soon">ER ${dateStr} (${days}d)</span>`;
  return `ER ${dateStr}`;
}
function fundLine(inst) {
  const f = inst.fund, p = [];
  if (f) {
    if (f.fwd_pe != null) p.push(`fwd P/E ${f.fwd_pe.toFixed(1)}`);
    if (f.peg != null) p.push(`PEG ${f.peg.toFixed(2)}`);
    if (f.next_earnings) p.push(earnTag(f.next_earnings));
  }
  if (inst.rvol != null) {
    p.push(`vol ${inst.rvol}% · ±${inst.rmove}%/mo`);
  }
  return p.join(" · ");
}
function teleResearch(inst) {
  const t = inst.tele;
  if (!t) return "";
  const rows = [];
  if (t.catalysts) rows.push(`<div class="tb">🗓 ${esc(t.catalysts.replace(/\*\*/g, ""))}</div>`);
  if (t.fundamentals) rows.push(`<div class="tb">📊 ${esc(t.fundamentals.replace(/\*\*/g, ""))}</div>`);
  if (t.historicals) rows.push(`<div class="tb">📈 ${esc(t.historicals.replace(/\*\*/g, ""))}</div>`);
  if (!rows.length) return "";
  return `<div class="teleblock"><div class="th">🔒 Your research (via Telegram)</div>${rows.join("")}</div>`;
}
function ideaBox(inst) {
  const i = inst.idea, f = inst.fund;
  const val = f ? [f.fwd_pe != null ? `fwd P/E ${f.fwd_pe.toFixed(1)}` : "", f.peg != null ? `PEG ${f.peg.toFixed(2)}` : ""].filter(Boolean).join(" · ") : "";
  const er = f && f.next_earnings ? earnTag(f.next_earnings) : "";
  const types = i.types.join(" + ");
  const exitList = (inst.exit_triggers || []).length
    ? `<div class="ir">watch for: ${inst.exit_triggers.join(" · ")}</div>` : "";
  return `<div class="ideabox" onclick="goTo('${inst.id}')">
    <div class="ih"><b>${inst.label}</b> <span class="id">${inst.id}</span> · ${val}</div>
    <div class="ir"><b>${types}</b>${er ? " · " + er : ""} · RSI ${inst.rsi ?? "–"}${inst.weekly_rsi != null ? ` (wk ${inst.weekly_rsi})` : ""}</div>
    ${exitList}

}
// Summary page focuses on the supply-chain core — periphery sectors excluded.
const SUMMARY_EXCLUDE = new Set(["china-ev", "singapore", "consumer"]);
function filterByCategory(instruments, category) {
  if (!category) return instruments.filter(i => !SUMMARY_EXCLUDE.has(getCategory(i)));
  return instruments.filter(i => getCategory(i) === category);
}

function renderIdeas(category) {

    html += `<div class="ideas-row">${tps.map(i => `<span class="tpchip" onclick="goTo('${i.id}')"><b>${i.label}</b> <span class="id">${i.id}</span> ${i.idea.types.join(" · ")}</span>`).join("")}</div>`;
  }
  el.innerHTML = html || `<div class="ideas-head">No confirmed entries right now — cash is a position.</div>`;
}

function prevPerfBlock(prev, label) {
  const list = Array.isArray(prev) ? prev : (prev ? [prev] : []);
  if (!list.length) return "";
  const line = (p) => {
    const cls = p.pct >= 0 ? "u" : "d";
    const src = p.source ? ` <span class="msrc">[${esc(p.source)}]</span>` : "";
    return `<div class="ct-prev">↩ <span class="pct ${cls}">${p.pct >= 0 ? "+" : ""}${p.pct}%</span>: ${esc(p.reason)}${src}</div>`;
  };
  return list.map(p => line(p)).join("");
}

        rows.push({ id: inst.id, label: inst.label, date: f.next_earnings, days: d,

  rows.sort((a, b) => a.days - b.days || a.id.localeCompare(b.id));

// Earnings detection for researched moves: explicit tag, or a quarter ref /
// "earnings" within the reason's first 3 words (same heuristic as build.py) -
// EXCEPT delivery reports ("Q2 2026 deliveries ~62,682 units missed..."),
// which open with the same Q[1-4] pattern but are a different event
// (confirmed live on TSLA/XPeng/NIO/Li Auto, wrongly badged EARNINGS before
// this exclusion). A 6-word window still allows "Q2 earnings: deliveries beat"
// to correctly count, since "earnings" would appear in that wider window too.
function isEarningsMove(mv) {
  if (mv.catalyst_type === "earnings") return true;
  const words = (mv.reason || "").match(/[a-zA-Z0-9]+/g) || [];
  const head3 = words.slice(0, 3).join(" ").toLowerCase();
  const head6 = words.slice(0, 6).join(" ").toLowerCase();
  const hasRef = /\bq[1-4]\b/.test(head3) || head3.includes("earnings");
  if (!hasRef) return false;
  if (head6.includes("deliver") && !head6.includes("earnings")) return false;
  return true;
}

function pastCatalystRows(category, lookbackDays = 30) {
  const rows = [];
  const today = new Date(), cutoff = new Date(today.getTime() - lookbackDays * 24 * 60 * 60 * 1000);
  const insts = filterByCategory(DATA.instruments, category);
  for (const inst of insts) {
    const m = MOVES && MOVES[inst.id];
    if (m) {
      const researched = (m.moves || []).filter(mv => mv.reason);
      for (const mv of researched) {
        const d = new Date(mv.d);
        if (d >= cutoff && d < today) {
          const label = isEarningsMove(mv) ? "<b style=\"color:#58a6ff\">📊 EARNINGS</b>" : "";
          rows.push({
            id: inst.id, label: inst.label, date: mv.d,
            event: (label ? `<div style="font-weight:600;margin-bottom:4px">${label}</div>` : "") + prevPerfBlock({ date: mv.d, pct: mv.pct, reason: mv.reason, source: mv.source }, "Move")
          });
        }
      }
    }
    // Quarters that reported but moved the stock <5% never make it into
    // moves.json (movements.py's detection floor), so they'd otherwise
    // vanish from every catalyst view. earnings_dates.json fills that gap
    // with real researched report dates. Skip entries covered_by_move (a
    // >=5% move already logged the same report - the block above has it).
    // EARN_DATES[id] is a LIST of quarters, not a single object - it used
    // to overwrite the prior quarter every time a newer one was researched,
    // silently losing anything older than "most recent" (confirmed missing:
    // Tencent's May/Aug/Nov 2025 quarters, all wiped by later overwrites).
    const edEntries = (EARN_DATES && EARN_DATES[inst.id]) || [];
    for (const ed of edEntries) {
      if (!ed.report_date || ed.covered_by_move) continue;
      const d = new Date(ed.report_date);
      if (d >= cutoff && d < today) {
        const pctPart = typeof ed.reaction_pct === "number"
          ? `<span class="pct ${ed.reaction_pct >= 0 ? "u" : "d"}">${ed.reaction_pct >= 0 ? "+" : ""}${ed.reaction_pct}%</span>: ` : "";
        const src = ed.source ? ` <span class="msrc">[${esc(ed.source)}]</span>` : "";
        rows.push({
          id: inst.id, label: inst.label, date: ed.report_date,
          event: `<div style="font-weight:600;margin-bottom:4px"><b style="color:#58a6ff">📊 EARNINGS</b></div>`
            + `<div class="ct-prev">${pctPart}${esc(ed.reason || "reported results")}${src}</div>`
        });
      }
    }
  }
  rows.sort((a, b) => new Date(b.date) - new Date(a.date));
  return rows;
}
function renderPastCatalysts(category, lookbackDays = 30) {
  const el = document.getElementById("pastCatalysts");
  if (STALE) { el.innerHTML = ""; return; }
  const rows = pastCatalystRows(category, lookbackDays);
  if (!rows.length) { el.innerHTML = ""; return; }
  const trs = rows.map(r => `<tr onclick="goTo('${r.id}')">
    <td class="ct-tk"><b>${r.id}</b> <span class="muted">${r.label}</span></td>
    <td class="ct-dt">${r.date}</td>
    <td class="ct-tx">${r.event}</td>
  </tr>`).join("");
  el.innerHTML = `<div class="ct-head">📅 Past Key Events — last ${lookbackDays} days</div>
    <table class="ct-table"><thead><tr><th>Ticker</th><th>Date</th><th>Event</th></tr></thead><tbody>${trs}</tbody></table>`;
}

window.goTo = function (id) {
  const el = document.getElementById("t-" + id);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
};

function keyRemark(inst) {
  const last = inst.last_close, items = [];
  const add = (label, ref) => {
    if (!ref) return;
    const d = (last / ref - 1) * 100;
    if (Math.abs(d) <= 3) items.push(`${label} ${d >= 0 ? "+" : ""}${d.toFixed(1)}%`);
  };
  add("20DMA", inst.sma20);
  add("50DMA", inst.sma50);
  (inst.flags || []).forEach(f => items.push(
    `${f.kind === "support" ? "Sup" : "Res"} ${f.price.toLocaleString(undefined, { maximumFractionDigits: 1 })} ${f.distance_pct >= 0 ? "+" : ""}${f.distance_pct.toFixed(1)}%`));
  const i = inst.idea;
  let tag = "", cls = "muted";
  if (i && i.kind === "enter") { tag = `⬤ ENTER — ${i.types.join(" + ")}`; cls = "enter"; }
  else if (i && i.kind === "take_profit") { tag = `▲ EXIT — ${i.types.join(" + ")}`; cls = "exit"; }
  else if (inst.trend === "down") { tag = "downtrend — not a long"; cls = "muted"; }
  const rsiStr = inst.rsi != null ? ` <span class="muted">RSI ${inst.rsi}</span>` : "";
  return { html: (tag ? `<b>${tag}</b>` : "") + (items.length ? " · " + items.join(" · ") : "") + rsiStr, cls };
}

function recentPastEvents(inst) {
  if (!MOVES || !MOVES[inst.id]) return "";
  const m = MOVES[inst.id];
  // moves.json arrays are stored newest-first (see movements.py) - take the
  // front, not the tail. slice(-2) was silently grabbing the OLDEST 2
  // researched moves instead, showing 500-600+ day-old events on every card.
  const researched = (m.moves || []).filter(mv => mv.reason).slice(0, 2);
  if (!researched.length) return "";
  const today = new Date();
  const rows = researched.map(mv => {
    const d = new Date(mv.d);
    if (d >= today) return "";
    const daysAgo = Math.floor((today - d) / (24 * 60 * 60 * 1000));
    const cls = mv.pct >= 0 ? "u" : "d";
    const label = mv.catalyst_type === "earnings" ? "📊" : (mv.catalyst_type === "beta" ? "📈" : "•");
    return `<div style="font-size:11px; margin:4px 0; padding:4px 0; border-top:1px solid var(--border);">
      ${label} <span class="pct ${cls}">${mv.pct >= 0 ? "+" : ""}${mv.pct.toFixed(2)}%</span>
      <span style="color:var(--muted); font-size:10px;">(${daysAgo}d ago)</span>
      <div style="font-size:10px; color:var(--muted); margin-top:2px;">${esc(mv.reason)}</div>
    </div>`;
  }).join("");
  return rows ? `<div style="padding:6px 10px; border-top:1px solid var(--border); background:rgba(88,166,255,.03);">${rows}</div>` : "";
}

function catalystTimeline(inst) {
  const f = inst.fund;
  const items = [];
  if (f) {
    const ed = daysTo(f.next_earnings);
    if (ed != null && ed >= 0 && ed <= 45) items.push({ d: f.next_earnings, days: ed, label: "Earnings", earn: true });
  }
  (inst.events || []).forEach(e => { const dd = daysTo(e.date); if (dd != null && dd >= 0 && dd <= 30) items.push({ d: e.date, days: dd, label: e.event, earn: false }); });
  if (!items.length) return "";
  items.sort((a, b) => a.days - b.days);
  return `<div class="cat">📅 ${items.map(i => i.earn ? `<b class="e">${esc(i.label)} ${i.d} (${i.days}d)</b>` : `${esc(i.label)} ${i.d} (${i.days}d)`).join(" · ")}</div>`;
}
function earningsBox(inst) {
  const f = inst.fund;
  if (!f || !f.next_earnings) return "";
  const days = daysTo(f.next_earnings);
  if (days == null || days < 0 || days > 35) return "";
  const beats = (f.earnings_history || []).map(q => {
    const s = q.surprise;
    if (s == null) return "";
    const num = Math.abs(s) >= 100 ? "(n/m)" : `${s >= 0 ? "+" : ""}${s}%`;
    return `<span class="pct ${s >= 0 ? "u" : "d"}">${(q.q || "").slice(0, 7)} ${s >= 0 ? "beat" : "miss"} ${num}</span>`;
  }).filter(Boolean).join(" ");
  const focusText = inst.earn ? inst.earn.split(/\s*Sources?:/i)[0].replace(/\((https?:[^)]+)\)/g, "").trim() : "";
  const focus = focusText ? `<div class="efocus">🎯 ${esc(focusText)}</div>` : "";
  const prevBlock = prevPerfBlock(inst.prev_earnings, "Last earnings");
  return `<div class="earn"><b>⏰ Earnings ${f.next_earnings} (${days}d)</b>${f.curr_est ? ` · est $${f.curr_est.toFixed(2)}` : ""}<br><span class="eh">Last 4Q:</span> ${beats || "—"}${focus}${prevBlock}</div>`;
}

function badges(inst) {
  const t = inst.trend || "flat";
  const tl = t === "up" ? "▲" : t === "down" ? "▼" : "–";
  let cta = "";
  if (inst.cta === "long") cta = `<span class="badge cta-long" title="trend-followers long">CTA↑</span>`;
  else if (inst.cta === "short") cta = `<span class="badge cta-short" title="trend-followers flipping short">CTA↓</span>`;
  const staleBadge = inst.stale
    ? `<span class="badge down" title="this ticker's fetch failed on the latest build">⚠ STALE</span>` : "";
  return `<span class="badge ${t}" title="trend: price vs 50/200DMA">${tl}</span>${cta}${staleBadge}`;
}


function drawChart(el, inst) {
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: "transparent" }, textColor: "#7d8590", fontSize: 10 },
    grid: { vertLines: { color: "#1b2027" }, horzLines: { color: "#1b2027" } },
    rightPriceScale: { borderColor: "#21262d" },
    timeScale: { borderColor: "#21262d", timeVisible: false },
    crosshair: { mode: 0 }, height: 300,
  });
  const area = chart.addAreaSeries({
    lineColor: "#f0648b", lineWidth: 2,
    topColor: "rgba(240,100,139,.28)", bottomColor: "rgba(240,100,139,.02)",
    priceLineVisible: true, lastValueVisible: true,
  });
  area.setData(inst.bars.map(b => ({ time: b.d, value: b.c })));
  const closes = inst.bars.map(b => b.c);
  const overlays = [
    ["#e3b341", smaSeries(closes, 20)],
    ["#58a6ff", smaSeries(closes, 50)],
    ["#f778ba", smaSeries(closes, 200)],
  ];
  for (const [color, series] of overlays) {
    const line = chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    line.setData(inst.bars.map((b, i) => ({ time: b.d, value: series[i] })).filter(x => x.value != null));
  }
  if (!STALE && inst.levels && inst.levels["3m"]) {
    const lv = inst.levels["3m"];
    (lv.support || []).forEach(s => area.createPriceLine({ price: s.price, color: "rgba(38,166,65,.5)", lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
    (lv.resistance || []).forEach(r => area.createPriceLine({ price: r.price, color: "rgba(248,81,73,.5)", lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
  }
  const lastDate = inst.bars[inst.bars.length - 1].d;
  try { chart.timeScale().setVisibleRange({ from: `${lastDate.slice(0, 4)}-04-30`, to: lastDate }); }
  catch (e) { chart.timeScale().fitContent(); }
}

function drawHistChart(el, inst) {
  const chart = LightweightCharts.createChart(el, {
    layout: { background: { color: "transparent" }, textColor: "#7d8590", fontSize: 9 },
    grid: { vertLines: { color: "#1b2027" }, horzLines: { color: "#1b2027" } },
    rightPriceScale: { borderColor: "#21262d" }, timeScale: { borderColor: "#21262d" }, height: 120,
  });
  const a = chart.addAreaSeries({ lineColor: "#f0648b", lineWidth: 2, topColor: "rgba(240,100,139,.25)", bottomColor: "rgba(240,100,139,.02)", priceLineVisible: false, lastValueVisible: true });
  a.setData(inst.bars.map(b => ({ time: b.d, value: b.c })));
  chart.timeScale().fitContent();
}

function card(inst) {
  const el = document.createElement("div");
  el.id = "t-" + inst.id;
  const isEnter = inst.idea && inst.idea.kind === "enter";
  el.className = "card" + (isEnter ? " enter-idea" : "");
  const rem = keyRemark(inst);
  const fl = fundLine(inst);
  el.innerHTML = `
    <div class="top">
      <span class="name">${inst.label}</span>
      <span class="id">${inst.id}</span>
      ${badges(inst)}
      <span class="px">${inst.last_close.toLocaleString(undefined, { maximumFractionDigits: 2 })}</span>
      ${fmtPct(inst.change_pct)} ${fmtPct(inst.ytd_pct)}
      <span class="muted" style="font-size:10px" title="the trading day this price/technicals reflect">as of ${inst.last_date}</span>
    </div>
    ${fl ? `<div class="fund">${fl}</div>` : ""}
    ${inst.news ? `<div class="news">📰 ${esc(inst.news)}</div>` : ""}
    <div class="remark ${rem.cls}">${rem.html}</div>
    <div class="chart" data-pending="1"></div>
    ${inst.catalyst ? `<div class="catline">🎯 ${esc(inst.catalyst)}</div>` : ""}
    ${catalystTimeline(inst)}
    ${recentPastEvents(inst)}
    ${earningsBox(inst)}
    ${teleResearch(inst)}`;
  el.querySelector(".chart")._inst = inst;
  return el;
}

function sortFn(a, b) {
  const ai = a.idea && a.idea.kind === "enter" ? 1 : 0, bi = b.idea && b.idea.kind === "enter" ? 1 : 0;
  if (ai !== bi) return bi - ai;
  return (TREND_ORDER[a.trend] ?? 3) - (TREND_ORDER[b.trend] ?? 3);
}

function render() {
  const byCat = {};
  for (const cat of CATEGORIES) byCat[cat.key] = [];
  for (const inst of DATA.instruments) {
    const cat = getCategory(inst);
    if (cat && byCat[cat]) byCat[cat].push(inst);
  }

  for (const cat of CATEGORIES) {
    const grid = document.getElementById("grid-" + cat.key);
    grid.innerHTML = "";
    // Group by subcategory (gold section headers), sort within each group.
    // China Internet stays flat - the tab is small enough that subsector
    // labels (E-commerce/Gaming/Search/etc) added noise without helping.
    const bySub = new Map();
    for (const inst of byCat[cat.key]) {
      const sub = cat.key === "china-internet" ? "Other" : getSubcategory(inst);
      if (!bySub.has(sub)) bySub.set(sub, []);
      bySub.get(sub).push(inst);
    }
    for (const [sub, insts] of bySub) {
      if (bySub.size > 1) {
        const head = document.createElement("div");
        head.className = "section subcat";
        head.textContent = sub;
        grid.appendChild(head);
      }
      insts.sort(sortFn).forEach(i => grid.appendChild(card(i)));
    }
  }

  // Lazy-render charts as they scroll into view (75 cards + history = heavy).
  OBSERVER = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      if (e.target.dataset.pending) {
        delete e.target.dataset.pending;
        drawChart(e.target, e.target._inst);
        OBSERVER.unobserve(e.target);
      } else if (e.target.dataset.pendingHist) {
        delete e.target.dataset.pendingHist;
        drawHistChart(e.target, e.target._inst);
        OBSERVER.unobserve(e.target);
      }
    }
  }, { rootMargin: "200px" });
  document.querySelectorAll(".chart").forEach(c => OBSERVER.observe(c));
}

// Per-sector stock history: below the cards, every researched move for that
// sector's names (the old Stock History tab, scoped to the current sector).
const HIST_RENDERED = new Set();
function renderSectorHistory(catKey) {
  if (HIST_RENDERED.has(catKey)) return;
  HIST_RENDERED.add(catKey);
  const wrap = document.getElementById("hist-" + catKey);
  const insts = filterByCategory(DATA.instruments, catKey);
  const cards = [];
  for (const inst of insts) {
    const m = MOVES && MOVES[inst.id];
    const researched = m ? (m.moves || []).filter(mv => mv.reason) : [];

    // Same gap earnings-dates.json fills in Past Key Events: a quarter that
    // reported but moved the stock <5% never lands in moves.json at all, so
    // without this it's invisible here too. EARN_DATES[id] is a LIST of
    // quarters (see the comment in pastCatalystRows) - a single-object
    // schema previously overwrote each ticker's older gap-filled quarters
    // every time a newer one was researched, silently losing them.
    const edEntries = (EARN_DATES && EARN_DATES[inst.id]) || [];
    const edMove = edEntries
      .filter(ed => ed.report_date && !ed.covered_by_move)
      .map(ed => ({ d: ed.report_date, pct: ed.reaction_pct, reason: ed.reason || "reported results",
                     source: ed.source, isEarnings: true }));

    const combined = [...researched, ...edMove].sort((a, b) => b.d.localeCompare(a.d));
    if (!combined.length) continue;
    const rows = combined.map(mv => {
      const hasPct = typeof mv.pct === "number";
      const cls = !hasPct ? "" : (mv.pct >= 0 ? "u" : "d");
      const pctText = hasPct ? `${mv.pct >= 0 ? "+" : ""}${mv.pct}%` : "—";
      const eTag = (mv.isEarnings || isEarningsMove(mv)) ? `<b style="color:#58a6ff">📊 EARNINGS</b> ` : "";

      return `<div class="mv"><span class="md">${mv.d}</span><span class="mp ${cls}">${pctText}</span><span class="mr">${eTag}${reason}${src}</span></div>`;

  grid.querySelectorAll(".hchart").forEach(c => OBSERVER.observe(c));
}

function renderRevenueMix() {

function _renderRevenueMixImpl(wrap) {
  wrap.dataset.rendered = "1";

    return m && inRevenueTabScope(i.id, m.category);

const CCY_SYMBOL = { USD: "$", HKD: "HK$", CNY: "¥", RMB: "¥", KRW: "₩", SGD: "S$", EUR: "€", TWD: "NT$" };
function fmtMoney(n, symbol) {
  if (n === null || n === undefined) return null;
  const abs = Math.abs(n);
  if (abs >= 1e12) return symbol + (n / 1e12).toFixed(2) + "T";
  if (abs >= 1e9) return symbol + (n / 1e9).toFixed(2) + "B";
  if (abs >= 1e6) return symbol + (n / 1e6).toFixed(1) + "M";
  return symbol + n.toFixed(0);
}
// Yahoo's market_cap comes back in each stock's LOCAL trading currency, not
// USD - confirmed live on Cambricon (raw value was actually CNY 686.7B, not
// USD) and Tencent (raw value was HKD 3.97T). Shows the real native-currency
// figure plus a USD-equivalent (via FX_RATES) for cross-stock comparability.
// stacked=true puts the USD-equivalent on its own line below the native
// figure instead of an inline parenthetical - used for the Compare tab's
// Mkt Cap column specifically, so that column can be narrower (the other
// callers - OCF, Debt/Cash - stay single-line since their column got wider
// instead of narrower).
function fmtMarketCap(n, currency, stacked) {
  if (n === null || n === undefined) return null;
  const ccy = currency || "USD";
  const symbol = CCY_SYMBOL[ccy] || (ccy + " ");
  const native = fmtMoney(n, symbol);
  if (ccy === "USD" || !FX_RATES || !FX_RATES[ccy]) return native;
  const usdEquiv = fmtMoney(n / FX_RATES[ccy], "$");
  return stacked
    ? `${native}<span class="cmp-mktcap-usd">${usdEquiv}</span>`
    : `${native} <span class="cmp-src-note">(~${usdEquiv})</span>`;
}
function fmtPctPlain(n, digits = 1) {
  return (n === null || n === undefined) ? null : (n * 100).toFixed(digits) + "%";
}
// Research only ever asks for "gross" or "operating" margin (see
// deep_fundamentals.py) - never fabricate an "EBITDA" label since that
// wasn't what was actually researched. Spells the type out clearly instead
// of the single-letter "G"/"O" abbreviation that was ambiguous.
function fmtMarginType(type) {
  const t = (type || "").toLowerCase();
  if (t.startsWith("gross")) return "GM";
  if (t.startsWith("operating")) return "Op. Margin";
  return type || "";
}

// TTM EPS = sum of the last 4 REPORTED (actual, not estimated) quarterly EPS.
// Only 4 quarters are tracked (see fundamentals.py), so this is the one point
// in time we can compute a real trailing EPS for - not enough history to walk
// a true multi-year P/E series without fabricating EPS for periods we never
// captured. Returns null (not a wrong number) if a quarter hasn't reported yet.
function ordinal(n) {
  const rem10 = n % 10, rem100 = n % 100;
  if (rem10 === 1 && rem100 !== 11) return n + "st";
  if (rem10 === 2 && rem100 !== 12) return n + "nd";
  if (rem10 === 3 && rem100 !== 13) return n + "rd";
  return n + "th";
}
function computeTtmEps(hist) {
  if (!hist || hist.length < 4) return null;
  const last4 = hist.slice(-4);
  if (last4.some(q => typeof q.actual !== "number")) return null;
  return last4.reduce((s, q) => s + q.actual, 0);
}

const NVDA_ECO_CATEGORY_COLORS = {

function nvdaEcoShortLabel(partner) {

function renderNvdaEcosystem() {
  const wrap = document.getElementById("nvda-eco-wrap");

    return;

  const byCat = new Map();
  for (const p of partnerships) {
    if (!byCat.has(p.category)) byCat.set(p.category, []);
    byCat.get(p.category).push(p);
  }
  const categories = Array.from(byCat.keys());
  const total = partnerships.length;

  // Hub-and-spoke: NVDA at center, one hub node per category positioned
  // around it, each category's partners spread in an arc beyond its hub.
  // Sector width per category is proportional to its partner count so a
  // 6-partner category (Enterprise/Vertical) doesn't visually cramp against
  // a 1-partner one (Telecom/Networking).
  const cx = 500, cy = 420, catR = 165, partnerR = 330;
  let angleCursor = -90; // start at top, go clockwise
  const nodes = []; // {x,y,label,color,type,title}
  const lines = []; // {x1,y1,x2,y2,color}
  for (const cat of categories) {
    const members = byCat.get(cat);
    const sectorWidth = 360 * (members.length / total);
    const catAngle = angleCursor + sectorWidth / 2;
    const color = NVDA_ECO_CATEGORY_COLORS[cat] || "#7d8590";
    const catRad = (catAngle * Math.PI) / 180;
    const catX = cx + catR * Math.cos(catRad), catY = cy + catR * Math.sin(catRad);
    nodes.push({ x: catX, y: catY, label: cat, color, type: "cat" });
    lines.push({ x1: cx, y1: cy, x2: catX, y2: catY, color });

    const innerSpan = Math.min(sectorWidth * 0.85, members.length > 1 ? sectorWidth * 0.85 : 0);
    members.forEach((p, i) => {
      const t = members.length > 1 ? (i / (members.length - 1)) - 0.5 : 0;
      const pAngle = catAngle + t * innerSpan;
      const pRad = (pAngle * Math.PI) / 180;
      const px = cx + partnerR * Math.cos(pRad), py = cy + partnerR * Math.sin(pRad);
      nodes.push({ x: px, y: py, label: nvdaEcoShortLabel(p.partner), color, type: "partner", unconfirmed: p.status === "unconfirmed", title: p.partner });
      lines.push({ x1: catX, y1: catY, x2: px, y2: py, color });
    });
    angleCursor += sectorWidth;
  }

  const svgLines = lines.map(l => `<line x1="${l.x1.toFixed(1)}" y1="${l.y1.toFixed(1)}" x2="${l.x2.toFixed(1)}" y2="${l.y2.toFixed(1)}" stroke="${l.color}" stroke-opacity="0.35" stroke-width="1.5"/>`).join("");
  const svgNodes = nodes.map(n => {
    const r = n.type === "cat" ? 8 : 5;
    const dy = n.y > cy ? 16 : -10;
    const dash = n.unconfirmed ? ' stroke-dasharray="2,2"' : "";
    return `<g>
      <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" fill="${n.color}"${dash} stroke="#0d1117" stroke-width="1.5">
        <title>${esc(n.title || n.label)}</title>
      </circle>
      <text x="${n.x.toFixed(1)}" y="${(n.y + dy).toFixed(1)}" text-anchor="middle" font-size="${n.type === "cat" ? 11 : 9.5}" font-weight="${n.type === "cat" ? 600 : 400}" fill="${n.type === "cat" ? n.color : "#c9d1d9"}">${esc(n.label)}${n.unconfirmed ? " *" : ""}</text>
    </g>`;
  }).join("");
  const centerNode = `<circle cx="${cx}" cy="${cy}" r="26" fill="#161b22" stroke="#76b900" stroke-width="2.5"/>
    <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="#76b900">NVDA</text>`;

  const mapHtml = `<svg viewBox="0 0 1000 800" style="width:100%; height:auto; max-height:640px;">
    ${svgLines}${svgNodes}${centerNode}
  </svg>`;

  const rows = partnerships.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(p => `<tr>
    <td style="max-width:150px; white-space:normal;"><b>${esc(p.partner)}</b></td>
    <td style="white-space:normal;"><span class="rev-qual" style="background:${NVDA_ECO_CATEGORY_COLORS[p.category] || "#7d8590"}22; color:${NVDA_ECO_CATEGORY_COLORS[p.category] || "#7d8590"}; padding:2px 6px; border-radius:4px; font-size:10px; white-space:nowrap;">${esc(p.category)}</span></td>
    <td>${esc(p.date || "—")}</td>
    <td style="white-space:nowrap;">${p.status === "unconfirmed" ? '<span class="pe-nm" title="Reported/rumored, not yet signed">⚠ unconfirmed</span>' : '<span class="pct u">confirmed</span>'}</td>
    <td style="max-width:420px; white-space:normal;">${esc(p.description || "")}</td>
    <td class="pe-nm" style="max-width:160px; white-space:normal;">${esc(p.source || "")}</td>
  </tr>`).join("");

  wrap.innerHTML = `<div class="hist-head">NVIDIA's ${new Date().getFullYear()} Partnership Ecosystem</div>
    <div class="rev-src" style="margin-bottom:10px">Curated, not exhaustive - the most significant, widely-covered partnerships NVIDIA announced this year, grouped by category. <b style="color:#f85149">Strategic Investment (Kingmaker)</b> is its own category, not folded into Chip/Hardware or Cloud/Hyperscaler: these are direct equity stakes (MediaTek, Marvell) and neocloud investments (Nebius, CoreWeave) where NVIDIA is financially building up the next generation of ASIC and GPU-cloud challengers rather than treating them as pure competitors or customers - aligning them to NVIDIA's own ecosystem instead. * / dashed node = reported but unconfirmed (not yet signed). ${data.fetched ? `Researched as of ${esc(data.fetched)}.` : ""}</div>
    ${mapHtml}
    <table class="cmp-table" style="margin-top:18px"><thead><tr>
      <th>Partner</th><th>Category</th><th>Date</th><th>Status</th><th>What it is</th><th>Source</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

    _renderPeHistoryImpl(wrap);
  } catch (e) {
    wrap.dataset.rendered = "";
    wrap.innerHTML = `<div class="rev-none" style="padding:16px;color:var(--down)">Render error: ${esc(e.message)} - data may have a malformed entry. Check console for details.</div>`;
    console.error("renderPeHistory failed:", e);
  }
}
function _renderPeHistoryImpl(wrap) {
  wrap.dataset.rendered = "1";
  const insts = DATA.instruments.filter(i => getCategory(i) && i.bars && i.bars.length);
  const byCat = new Map();
  for (const inst of insts) {
    const catKey = getCategory(inst);
    const catLabel = CATEGORIES.find(c => c.key === catKey).label;
    if (!byCat.has(catLabel)) byCat.set(catLabel, []);
    byCat.get(catLabel).push(inst);
  }
  const na = `<span class="cmp-na">—</span>`;
  let rows = "";
  for (const [cat, list] of byCat) {
    rows += `<tr class="cmp-cat-row"><td colspan="7">${esc(cat)}</td></tr>`;
    for (const inst of sortForCategoryTab(list, cat)) {
      const f = inst.fund || {};
      const bars = inst.bars;
      const price = bars[bars.length - 1].c;
      const ttmEps = computeTtmEps(f.earnings_history);
      const win = bars.slice(-252);
      const hi52 = Math.max(...win.map(b => b.h));
      const lo52 = Math.min(...win.map(b => b.l));

      let ttmPeCell = na;
      if (ttmEps != null) {
        ttmPeCell = ttmEps > 0
          ? `<span class="pe-current">${(price / ttmEps).toFixed(1)}x</span>`
          : `<span class="pe-nm">N/M (loss)</span>`;
      }
      const fwdPe = (f.fwd_pe != null) ? f.fwd_pe.toFixed(1) + "x" : na;
      const peg = (f.peg != null) ? f.peg.toFixed(2) : na;
      const rangeCell = (hi52 > 0 && lo52 > 0) ? `$${lo52.toFixed(2)} – $${hi52.toFixed(2)}` : na;

      let impliedCell = na;
      if (ttmEps != null && ttmEps > 0 && hi52 > lo52) {
        const peLo = (lo52 / ttmEps).toFixed(1);
        const peHi = (hi52 / ttmEps).toFixed(1);
        const pct = Math.max(0, Math.min(100, ((price - lo52) / (hi52 - lo52)) * 100));
        impliedCell = `<div class="pe-range-wrap">
          <div class="pe-range-lbl"><span>${peLo}x</span><span>${peHi}x</span></div>
          <div class="pe-range-track"><div class="pe-range-marker" style="left:${pct.toFixed(0)}%" title="Currently at the ${ordinal(Math.round(pct))} percentile of its 52-wk range"></div></div>
        </div>`;
      } else if (ttmEps != null && ttmEps <= 0) {
        impliedCell = `<span class="pe-nm">N/M — trailing EPS negative</span>`;
      }

      rows += `<tr>
        <td>${companyIdCell(inst)}</td>
        <td>$${price.toFixed(2)}</td>
        <td>${ttmPeCell}</td>
        <td>${fwdPe}</td>
        <td>${peg}</td>
        <td>${rangeCell}</td>
        <td>${impliedCell}</td>
      </tr>`;
    }
  }
  wrap.innerHTML = `<table class="cmp-table"><thead><tr>
      <th>Company</th><th>Price</th><th>TTM P/E</th><th>Fwd P/E</th><th>PEG</th>
      <th>52-wk Price Range</th><th>Implied P/E Range (52-wk)</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <div class="rev-src" style="margin-top:8px">TTM P/E uses actual trailing EPS from the last 4 reported quarters (Yahoo). Implied P/E range applies TODAY's TTM EPS to the 52-week price high/low, so it shows where the stock has traded at its CURRENT earnings power — not a true multi-year re-rating history (only 4 quarters of EPS are tracked, not enough to reconstruct EPS at each point in the past). Marker shows where the current price sits in that range; hover for the exact percentile. Fwd P/E and PEG are Yahoo consensus estimates. N/M = not meaningful (trailing EPS negative).</div>`
    + buildHistPeSection();
}

// 5-year annual P/E, scoped to the same AI/tech cohort as Compare/Revenue Mix
// (real diluted EPS per fiscal year isn't available for the full 76-name
// universe without a much larger research pass - see historical_pe.py).
function buildHistPeSection() {
  if (!HIST_PE) return "";
  const insts = DATA.instruments.filter(i => {
    const m = SC_MAP && SC_MAP[i.id];
    return m && inRevenueTabScope(i.id, m.category) && HIST_PE[i.id];
  });
  if (!insts.length) return "";
  const CAT_LABEL = { "china-internet": "China Internet", "compute": "Compute",
    "hyperscaler-cloud": "Tech Platforms", "platform": "Tech Platforms", "equipment": "Equipment" };
  const byCat = new Map();
  for (const inst of insts) {
    const cat = CAT_LABEL[SC_MAP[inst.id].category] || SC_MAP[inst.id].category;
    if (!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push(inst);
  }
  const na = `<span class="cmp-na">—</span>`;
  let rows = "";
  for (const [cat, list] of byCat) {
    rows += `<tr class="cmp-cat-row"><td colspan="11">${esc(cat)}</td></tr>`;
    for (const inst of sortForCategoryTab(list, cat)) {
      const hp = HIST_PE[inst.id];
      // Sort by actual date rather than trust research-response order - some
      // responses came back oldest-first, others newest-first, inconsistently.
      const years = (hp.years || []).slice()
        .sort((a, b) => (a.period_end || "").localeCompare(b.period_end || ""));
      // Right-align to 5 slots so the most recent fiscal year always lands in
      // the same (last) column across companies - names with fewer than 5
      // years (recent IPOs) leave their earliest slot(s) blank on the left
      // rather than shifting everything over.
      const recent = years.slice(-5);
      const slots = new Array(5).fill(null);
      for (let i = 0; i < recent.length; i++) slots[5 - recent.length + i] = recent[i];
      const yearCells = slots.map(y => {
        if (!y) return `<td>${na}</td>`;
        const label = esc(y.fy_label || y.period_end || "?");
        if (y.pe != null) {
          const warn = y.flag ? ` <span class="rev-qual" title="${esc(y.flag)}">⚠</span>` : "";
          const conv = y.converted ? `<span class="rev-qual" title="${esc(y.note || "currency-converted")}">*</span>` : "";
          return `<td><span class="pe-current">${y.pe}x</span>${conv}${warn}<br><span class="pe-nm">${label}</span></td>`;
        }
        return `<td><span class="pe-nm" title="${esc(y.note || "")}">${esc(y.flag || "n/a")}</span><br><span class="pe-nm">${label}</span></td>`;
      }).join("");
      const avg3y = hp.avg_3y != null
        ? `${hp.avg_3y}x <span class="pe-nm">(${hp.avg_3y_count}yr)</span>` : na;
      const avg5y = hp.avg_5y != null
        ? `${hp.avg_5y}x <span class="pe-nm">(${hp.avg_5y_count}yr)</span>` : na;

      // Forward: align each estimate to its REAL offset from T (the latest
      // completed fiscal year), not just left-packed in whatever order
      // estimates came back. Yahoo's own "+1y" consensus is relative to
      // ITS notion of the current fiscal year - for a company deep into an
      // unreported fiscal year, that's often 2-3 years past T, not 1.
      // Left-packing would silently mislabel a T+2 estimate as T+1 and
      // leave the true T+1 slot (usually just missing/unreported) invisible
      // instead of shown blank.
      const fp = FWD_PE && FWD_PE[inst.id];
      const fpYears = fp ? (fp.years || []).slice()
        .sort((a, b) => (a.period_end || "").localeCompare(b.period_end || "")) : [];
      const fpSlots = new Array(3).fill(null);
      const tYear = years.length ? parseFyYear(years[years.length - 1].fy_label) : null;
      if (tYear != null) {
        for (const y of fpYears) {
          const fy = parseFyYear(y.fy_label);
          if (fy == null) continue;
          const offset = fy - tYear;
          if (offset >= 1 && offset <= 3) fpSlots[offset - 1] = y;
        }
      } else {
        // No historical anchor (recent IPO, no reported fiscal year yet) -
        // fall back to left-packing since there's nothing to align against.
        for (let i = 0; i < Math.min(3, fpYears.length); i++) fpSlots[i] = fpYears[i];
      }
      const fwdCells = fpSlots.map(y => {
        if (!y) return `<td>${na}</td>`;
        const label = esc(y.fy_label || y.period_end || "?");
        const nAnalysts = y.num_analysts != null
          ? ` <span class="pe-nm" title="${y.num_analysts} analysts in consensus">(${y.num_analysts})</span>` : "";
        if (y.pe != null) {
          const warn = y.flag ? ` <span class="rev-qual" title="${esc(y.flag)}">⚠</span>` : "";
          const conv = y.converted ? `<span class="rev-qual" title="${esc(y.source || "currency-converted")}">*</span>` : "";
          return `<td><span class="pe-current">${y.pe}x</span>${conv}${warn}<br><span class="pe-nm">${label}${nAnalysts}</span></td>`;
        }
        return `<td><span class="pe-nm" title="${esc(y.flag || y.source || "")}">${y.flag ? "⚠ n/a" : "n/a"}</span><br><span class="pe-nm">${label}</span></td>`;
      }).join("");

      rows += `<tr>
        <td>${companyIdCell(inst)}</td>
        ${yearCells}
        ${fwdCells}
        <td>${avg3y}</td>
        <td>${avg5y}</td>
      </tr>`;
    }
  }
  return `<div class="hist-head" style="margin-top:22px">Historical &amp; Forward P/E — AI/Tech Cohort</div>
    <table class="cmp-table"><thead><tr>
      <th>Company</th><th>T-4</th><th>T-3</th><th>T-2</th><th>T-1</th><th>T (Latest)</th>
      <th>T+1</th><th>T+2</th><th>T+3</th><th>3-Yr Avg</th><th>5-Yr Avg</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <div class="rev-src" style="margin-top:8px">Historical (T-4..T) = fiscal year-end closing price ÷ that fiscal year's actual GAAP diluted EPS, research-derived from filings. Forward (T+1..T+3) = TODAY's price ÷ analyst consensus EPS estimate. T+1 and T+2 are real sourced Yahoo Finance consensus (analyst count shown in parentheses) when Yahoo has coverage; T+3 always, and T+1/T+2 when Yahoo has no coverage, require a named multi-analyst consensus aggregator (Zacks, TipRanks, MarketScreener, etc.) — most names genuinely have no such coverage that far out, shown as n/a rather than a guess, not a research gap. Columns are relative to each company's own fiscal calendar (T = most recent completed fiscal year), not calendar year — the actual FY label and analyst count are shown under each value. Companies reporting in a different currency than their traded shares are converted using the relevant historical or spot FX rate, marked * — hover for detail. ⚠ flags a P/E outside a plausible range (a real failure mode: Yahoo's own consensus data has been wrong for at least one name in this cohort — PDD's trailing AND forward EPS were both ~8-10x inflated on Yahoo's feed, caught by this check and excluded). This data is LLM/API-researched, not a Bloomberg/FactSet-grade feed — treat as a first pass, not verified truth.</div>`;
}

window.showTab = function (tabKey) {
  document.getElementById("tab-summary").classList.toggle("active", tabKey === "summary");
  document.getElementById("tab-revenue").classList.toggle("active", tabKey === "revenue");
  document.getElementById("revenue-wrap").style.display = tabKey === "revenue" ? "" : "none";
  document.getElementById("tab-compare").classList.toggle("active", tabKey === "compare");
  document.getElementById("compare-wrap").style.display = tabKey === "compare" ? "" : "none";
  document.getElementById("tab-pe").classList.toggle("active", tabKey === "pe");
  document.getElementById("pe-wrap").style.display = tabKey === "pe" ? "" : "none";
  document.getElementById("tab-nvda-eco").classList.toggle("active", tabKey === "nvda-eco");
  document.getElementById("nvda-eco-wrap").style.display = tabKey === "nvda-eco" ? "" : "none";
  for (const c of CATEGORIES) {
    document.getElementById("tab-" + c.key).classList.toggle("active", tabKey === c.key);
    const show = tabKey === c.key;
    document.getElementById("grid-" + c.key).style.display = show ? "" : "none";
    document.getElementById("hist-" + c.key).style.display = show ? "" : "none";
  }
  // Revenue Mix / Compare are pure reference tables - no ideas/catalysts
  // sections. Those divs are fixed top-level elements shared across every
  // tab, so without this they'd keep showing stale content from whichever
  // tab was active before switching here.
  const showIdeas = tabKey !== "revenue" && tabKey !== "compare" && tabKey !== "pe" && tabKey !== "nvda-eco";
  document.getElementById("ideas").style.display = showIdeas ? "" : "none";
  document.getElementById("catalysts30").style.display = showIdeas ? "" : "none";
  document.getElementById("pastCatalysts").style.display = showIdeas ? "" : "none";
  if (tabKey === "revenue") {
    if (DATA) renderRevenueMix();
    return;
  }
  if (tabKey === "compare") {
    if (DATA) renderCompareTable();
    return;
  }
  if (tabKey === "pe") {
    if (DATA) renderPeHistory();
    return;
  }
  if (tabKey === "nvda-eco") {
    if (DATA) renderNvdaEcosystem();
    return;
  }
  const category = tabKey === "summary" ? null : tabKey;
  if (DATA) {
    renderIdeas(category);
    renderCatalystsTable(category);
    renderPastCatalysts(category, 30);
    if (category) renderSectorHistory(category);
  }
};

function buildShell() {
  const tabs = document.getElementById("tabs");
  const grids = document.getElementById("grids");
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.id = "tab-" + key; b.textContent = label;
    b.onclick = () => showTab(key);
    tabs.appendChild(b);
  };
  mk("summary", "Summary");
  for (const c of CATEGORIES) {
    mk(c.key, c.label);
    const main = document.createElement("main");
    main.id = "grid-" + c.key; main.className = "monitor-grid"; main.style.display = "none";
    grids.appendChild(main);
    const hist = document.createElement("div");
    hist.id = "hist-" + c.key; hist.className = "hist-wrap"; hist.style.display = "none";
    grids.appendChild(hist);
  }
  mk("revenue", "Revenue Mix");
  const revWrap = document.createElement("div");
  revWrap.id = "revenue-wrap"; revWrap.className = "rev-wrap"; revWrap.style.display = "none";
  grids.appendChild(revWrap);

  mk("compare", "Compare");
  const cmpWrap = document.createElement("div");
  cmpWrap.id = "compare-wrap"; cmpWrap.className = "cmp-wrap"; cmpWrap.style.display = "none";
  grids.appendChild(cmpWrap);

  mk("pe", "P/E History");
  const peWrap = document.createElement("div");
  peWrap.id = "pe-wrap"; peWrap.className = "cmp-wrap"; peWrap.style.display = "none";
  grids.appendChild(peWrap);

  mk("nvda-eco", "NVDA Ecosystem");
  const nvdaEcoWrap = document.createElement("div");
  nvdaEcoWrap.id = "nvda-eco-wrap"; nvdaEcoWrap.className = "cmp-wrap"; nvdaEcoWrap.style.display = "none";
  grids.appendChild(nvdaEcoWrap);
}

function load() {
  document.getElementById("meta").textContent = "fetching data...";
  buildShell();
  Promise.all([
    fetch("./data.json?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
    fetch("./moves.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./supply-chain-map.json?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(`map HTTP ${r.status}`); return r.json(); }),
    fetch("./earnings-dates.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./revenue-breakdown.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./deep-fundamentals.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./geo-mix.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./fx-rates.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./off-bs-liabilities.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./historical-pe.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./forward-pe.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./roic.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
    fetch("./nvda-partnerships.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({})),
  ]).then(([data, moves, scmap, earnDates, revMix, deepFund, geoMix, fxRates, offBs, histPe, fwdPe, roic, nvdaPartnerships]) => {
    DATA = data; MOVES = moves; SC_MAP = scmap; EARN_DATES = earnDates; REV_MIX = revMix; DEEP_FUND = deepFund; GEO_MIX = geoMix; FX_RATES = fxRates; OFF_BS = offBs; HIST_PE = histPe; FWD_PE = fwdPe; ROIC = roic; NVDA_PARTNERSHIPS = nvdaPartnerships;
    STALE = checkStale(DATA);
    const ideas = DATA.instruments.filter(i => i.idea && i.idea.kind === "enter").length;
    document.getElementById("meta").textContent =
      `${DATA.instruments.length} names · ${ideas} enter ideas · ${new Date(DATA.generated_at).toLocaleString()}`;
    render();
    showTab("summary");
  }).catch(err => {
    console.error("load error:", err);
    document.getElementById("meta").textContent = `ERROR: ${err.message}`;
  });
}
load();
</script>
