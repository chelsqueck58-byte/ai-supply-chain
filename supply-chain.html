<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Chain Intelligence</title><!-- Cache bust: 1786645109 -->
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#21262d; --text:#e6edf3;
    --muted:#7d8590; --up:#26a641; --down:#f85149;
    --ema:#e3b341; --sma:#58a6ff; --vwap:#bc8cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); position:sticky; top:0;
    background:var(--bg); z-index:5; }
  header h1 { margin:0 0 3px; font-size:15px; font-weight:600; letter-spacing:.3px; display:inline; }
  header .meta { color:var(--muted); font-size:12px; margin-left:10px; }
  header .tabs { display:flex; gap:0; margin-top:8px; border-bottom:1px solid var(--border); }
  header .tab { padding:8px 12px; cursor:pointer; color:var(--muted); font-size:12px; font-weight:600;
    text-transform:uppercase; letter-spacing:.4px; border-bottom:2px solid transparent; }
  header .tab.active { color:var(--text); border-bottom-color:#58a6ff; }
  header .tab:hover { color:var(--text); }
  #stale { display:none; background:var(--down); color:#fff; padding:10px 16px; font-weight:600; text-align:center; }
  #stale.show { display:block; }
  main { padding:12px; display:none; }
  main.active { display:block; }
  .category-header { background:#1b2835; border:1px solid #2d3f5a; border-radius:8px; padding:10px 12px;
    margin-bottom:12px; font-size:11px; }
  .category-title { font-weight:700; color:#58a6ff; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .category-stats { display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--muted); }
  .stat { display:flex; gap:4px; }
  .stat-label { color:var(--muted); }
  .stat-value { color:var(--text); font-weight:600; }
  .region-label { font-size:12px; font-weight:700; color:#58a6ff; text-transform:uppercase;
    letter-spacing:.4px; margin-top:16px; margin-bottom:8px; padding:8px 0; border-top:1px solid var(--border); }
  .region-label:first-child { margin-top:0; border-top:none; }
  .subcategory { font-size:11px; color:var(--muted); margin-bottom:8px; padding:6px 8px;
    background:rgba(88,166,255,.06); border-radius:4px; }
  .stock-grid { display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .card .top { display:flex; align-items:center; gap:6px; padding:8px 10px; flex-wrap:wrap; }
  .card .name { font-weight:600; }
  .card .id { color:var(--muted); font-size:11px; }
  .card .px { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600; }
  .pct { font-variant-numeric:tabular-nums; font-size:11px; }
  .pct.u { color:var(--up); } .pct.d { color:var(--down); }
  .badge { font-size:10px; font-weight:600; padding:1px 5px; border-radius:4px; white-space:nowrap; }
  .badge.up { color:var(--up); background:rgba(38,166,65,.14); }
  .badge.down { color:var(--down); background:rgba(248,81,73,.14); }
  .badge.flat { color:var(--muted); background:rgba(125,133,144,.14); }
  .fund { padding:6px 10px; font-size:10px; color:var(--muted); border-top:1px solid var(--border);
    font-variant-numeric:tabular-nums; }
  .remark { padding:6px 10px; font-size:10px; border-top:1px solid var(--border);
    font-variant-numeric:tabular-nums; }
  .remark.enter { color:var(--up); }
  .remark.exit { color:var(--down); }
  .cat { padding:5px 10px; font-size:10px; color:var(--text); border-top:1px solid var(--border); }
  .cat b.e { color:var(--down); }
</style>
</head>
<body>
<header>
  <h1>Supply Chain Intelligence</h1>
  <div class="meta">52 stocks · <span id="meta">loading...</span> · <a href="./index.html" style="color:#58a6ff;text-decoration:none;">← Stock Monitor</a></div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="stale">Data is stale (>30 hours). Check back soon.</div>
<main id="summary"></main>
<main id="platform"></main>
<main id="compute"></main>
<main id="foundry"></main>
<main id="memory"></main>
<main id="equipment"></main>
<main id="power"></main>
<main id="history"></main>

<script src="https://unpkg.com/lightweight-charts@3/dist/lightweight-charts.standalone.production.js"></script>
<script>
let DATA = null, MOVES = null, FUND = null, SC_MAP = null;

const CATEGORIES = [
  { id: "summary", label: "Summary" },
  { id: "platform", label: "Platform & Hyperscaler" },
  { id: "compute", label: "Compute" },
  { id: "foundry", label: "Foundry" },
  { id: "memory", label: "Memory" },
  { id: "equipment", label: "Equipment" },
  { id: "power", label: "Power/Analog" },
  { id: "history", label: "Stock History" }
];

function esc(s) { return (s||"").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" })[c]); }

function checkStale(data) {
  if (!data || !data.generated_at) return false;
  const age = (Date.now() - new Date(data.generated_at).getTime()) / 3600000;
  return age > 30;
}

function getPerfBadge(pct) {
  if (!pct && pct !== 0) return "";
  const cls = pct >= 0 ? "up" : "down";
  const sign = pct >= 0 ? "+" : "";
  return `<span class="badge ${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function categoryIndex() {
  if (!SC_MAP) return {};
  const idx = {};
  for (const ticker of Object.keys(SC_MAP)) {
    const info = SC_MAP[ticker];
    const cat = info.category;
    if (!idx[cat]) idx[cat] = {};
    if (!idx[cat][info.region]) idx[cat][info.region] = [];
    idx[cat][info.region].push(ticker);
  }
  return idx;
}

function getCategoryStats(categoryName, region) {
  const idx = categoryIndex();
  const tickers = (idx[categoryName] && idx[categoryName][region]) || [];
  if (!tickers.length) return null;

  let perf1m = 0, perf3m = 0, perf1y = 0, count = 0;
  let catalystCount = 0;

  for (const ticker of tickers) {
    const inst = DATA.instruments.find(i => i.id === ticker);
    if (!inst || !inst.bars || !inst.bars.length) continue;

    const bars = inst.bars;
    const now = bars[bars.length - 1].c;
    const bar21 = bars[Math.max(0, bars.length - 21)].c;
    const bar63 = bars[Math.max(0, bars.length - 63)].c;
    const bar252 = bars[Math.max(0, bars.length - 252)].c;

    perf1m += (now / bar21 - 1) * 100;
    perf3m += (now / bar63 - 1) * 100;
    perf1y += (now / bar252 - 1) * 100;
    count++;

    if (MOVES && MOVES[ticker]) {
      const upcoming = (MOVES[ticker].upcoming || []).filter(e => new Date(e.date) >= new Date()).length;
      catalystCount += upcoming;
    }
  }

  if (count === 0) return null;
  return { perf1m: perf1m/count, perf3m: perf3m/count, perf1y: perf1y/count, catalystCount };
}

function renderCategoryTab(categoryName) {
  if (categoryName === "summary") return renderSummaryTab();
  if (categoryName === "history") return renderHistoryTab();

  const idx = categoryIndex();
  const regions = idx[categoryName] ? Object.keys(idx[categoryName]) : [];

  let html = `<div class="category-header">
    <div class="category-title">${esc(categoryName)}</div>
  </div>`;

  for (const region of regions) {
    const stats = getCategoryStats(categoryName, region);
    if (stats) {
      html += `<div class="category-header" style="margin-top:8px;">
        <div style="font-size:12px; color:var(--muted);">${region === "US" ? "🇺🇸 US/Global" : "🇨🇳 China"}</div>
        <div class="category-stats">
          <div class="stat"><span class="stat-label">1m:</span> <span class="stat-value">${stats.perf1m >= 0 ? "+" : ""}${stats.perf1m.toFixed(1)}%</span></div>
          <div class="stat"><span class="stat-label">3m:</span> <span class="stat-value">${stats.perf3m >= 0 ? "+" : ""}${stats.perf3m.toFixed(1)}%</span></div>
          <div class="stat"><span class="stat-label">1y:</span> <span class="stat-value">${stats.perf1y >= 0 ? "+" : ""}${stats.perf1y.toFixed(1)}%</span></div>
          <div class="stat"><span class="stat-label">Catalysts:</span> <span class="stat-value">${stats.catalystCount}</span></div>
        </div>
      </div>`;
    }

    const tickers = idx[categoryName][region] || [];
    if (!tickers.length) continue;

    html += `<div class="region-label">${region === "US" ? "🇺🇸 US/Global Stocks" : "🇨🇳 China Stocks"}</div>`;

    // Group by subcategory
    const subgroups = {};
    for (const ticker of tickers) {
      const subcat = SC_MAP[ticker].subcategory;
      if (!subgroups[subcat]) subgroups[subcat] = [];
      subgroups[subcat].push(ticker);
    }

    for (const [subcat, stickers] of Object.entries(subgroups)) {
      html += `<div class="subcategory">${esc(subcat)}: ${stickers.map(t => esc(SC_MAP[t].name || t)).join(", ")}</div>`;

      html += `<div class="stock-grid">`;
      for (const ticker of stickers) {
        html += renderStockCard(ticker);
      }
      html += `</div>`;
    }
  }

  return html;
}

function renderStockCard(ticker) {
  const inst = DATA.instruments.find(i => i.id === ticker);
  if (!inst) return "";

  const last = inst.last_close;
  const bars = inst.bars || [];
  const pct24h = bars.length > 1 ? ((bars[bars.length-1].c / bars[bars.length-2].c) - 1) * 100 : 0;

  const fund = FUND && FUND[ticker] || {};
  const fwdPE = fund.fwd_pe ? fund.fwd_pe.toFixed(1) : "—";

  const fundHtml = `<div class="fund">Fwd P/E: <b>${fwdPE}x</b></div>`;

  return `<div class="card" onclick="goTo('${ticker}')">
    <div class="top">
      <div><div class="name">${esc(inst.label)}</div><div class="id">${esc(ticker)}</div></div>
      <div class="px">$${last.toLocaleString(undefined, {maximumFractionDigits:2})}</div>
    </div>
    <div class="remark">${getPerfBadge(pct24h)} 24h</div>
    ${fundHtml}
  </div>`;
}

function renderSummaryTab() {
  const idx = categoryIndex();
  let html = `<div class="category-header">
    <div class="category-title">All Categories Overview</div>
  </div>`;

  for (const [catName, regions] of Object.entries(idx)) {
    const stats = {};
    for (const region of Object.keys(regions)) {
      stats[region] = getCategoryStats(catName, region);
    }

    html += `<div class="category-header" style="margin-top:12px;">
      <div class="category-title">${esc(catName)}</div>`;

    for (const [region, stat] of Object.entries(stats)) {
      if (!stat) continue;
      html += `<div class="category-stats" style="margin-top:4px;">
        <span style="color:var(--muted);">${region}:</span>
        <div class="stat"><span class="stat-label">1m:</span> <span class="stat-value">${stat.perf1m >= 0 ? "+" : ""}${stat.perf1m.toFixed(1)}%</span></div>
        <div class="stat"><span class="stat-label">3m:</span> <span class="stat-value">${stat.perf3m >= 0 ? "+" : ""}${stat.perf3m.toFixed(1)}%</span></div>
        <div class="stat"><span class="stat-label">1y:</span> <span class="stat-value">${stat.perf1y >= 0 ? "+" : ""}${stat.perf1y.toFixed(1)}%</span></div>
      </div>`;
    }
    html += `</div>`;
  }

  return html;
}

function renderHistoryTab() {
  return `<div style="padding:16px; color:var(--muted);">Coming soon: historical view of all stock moves</div>`;
}

function showTab(tabId) {
  document.querySelectorAll("main").forEach(m => m.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  document.querySelector(`[data-tab="${tabId}"]`).classList.add("active");
}

window.goTo = function(ticker) {
  console.log("Clicked:", ticker);
};

function load() {
  document.getElementById("meta").textContent = "loading...";

  Promise.all([
    fetch("./data.json?t=" + Date.now()).then(r => r.json()),
    fetch("./moves.json?t=" + Date.now()).then(r => r.json()).catch(() => ({})),
    fetch("./data/fundamentals.json?t=" + Date.now()).then(r => r.json()).catch(() => ({})),
    fetch("./data/supply-chain-map.json?t=" + Date.now()).then(r => r.json()).catch(() => ({}))
  ]).then(([data, moves, fund, scmap]) => {
    DATA = data;
    MOVES = moves;
    FUND = fund;
    SC_MAP = scmap;

    document.getElementById("meta").textContent =
      `${DATA.instruments.length} stocks · ${new Date(DATA.generated_at).toLocaleString()}`;

    // Render tabs
    const tabsDiv = document.getElementById("tabs");
    CATEGORIES.forEach((cat, idx) => {
      const tab = document.createElement("div");
      tab.className = "tab" + (idx === 0 ? " active" : "");
      tab.textContent = cat.label;
      tab.setAttribute("data-tab", cat.id);
      tab.onclick = () => {
        showTab(cat.id);
        document.getElementById(cat.id).innerHTML = renderCategoryTab(cat.id);
      };
      tabsDiv.appendChild(tab);
    });

    showTab("summary");
    document.getElementById("summary").innerHTML = renderCategoryTab("summary");

    if (checkStale(DATA)) {
      document.getElementById("stale").classList.add("show");
    }
  }).catch(err => {
    console.error(err);
    document.getElementById("meta").textContent = "error loading data";
  });
}

window.addEventListener("load", load);
</script>
</body>
</html>
